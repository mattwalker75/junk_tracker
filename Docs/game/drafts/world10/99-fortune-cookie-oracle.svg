<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Fortune Cookie Oracle, a floating golden fortune cookie with a glowing third eye, a blank paper fortune sticking out like a tongue, and mystic swirls and sparkles around it">
  <defs>
    <clipPath id="fortune-cookie-oracle-cookie"><path d="M18 108 Q22 40 100 44 Q178 40 182 108 Q164 124 138 112 Q120 138 100 144 Q80 138 62 112 Q36 124 18 108 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="190" rx="60" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <!-- mystic swirls -->
  <g fill="none" stroke="#a77bff" stroke-width="4" stroke-linecap="round">
    <path d="M36 28 Q100 0 164 28"/>
    <path d="M34 168 Q14 160 18 142 Q24 128 38 134 Q46 142 38 148"/>
    <path d="M178 176 Q192 164 186 150 Q178 140 168 148 Q164 156 172 158"/>
  </g>
  <g fill="#a77bff"><circle cx="12" cy="72" r="3"/><circle cx="62" cy="178" r="2.5"/><circle cx="188" cy="72" r="3"/></g>
  <!-- the paper fortune, stuck out like a tongue -->
  <g transform="rotate(-34 104 126)">
    <path d="M95 118 L113 118 L115 174 Q108 169 104 176 Q100 169 93 174 Z" fill="#ffffff" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M98 142 L110 142 M98 152 L111 152 M98 162 L110 162" stroke="#c9bfdc" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- the cookie -->
  <path d="M18 108 Q22 40 100 44 Q178 40 182 108 Q164 124 138 112 Q120 138 100 144 Q80 138 62 112 Q36 124 18 108 Z" fill="#f2b85a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#fortune-cookie-oracle-cookie)">
    <path d="M144 40 Q192 70 170 124 L192 124 L192 36 Z" fill="#d0903a"/>
    <path d="M18 108 Q36 100 62 112 L60 124 L18 124 Z M182 108 Q164 100 138 112 L140 124 L182 124 Z" fill="#c47f2e"/>
  </g>
  <path d="M18 108 Q22 40 100 44 Q178 40 182 108 Q164 124 138 112 Q120 138 100 144 Q80 138 62 112 Q36 124 18 108 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- the folds -->
  <path d="M18 108 Q38 98 62 112 M182 108 Q162 98 138 112" fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 104 Q52 86 34 80 M140 104 Q148 86 166 80" fill="none" stroke="#b8732e" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 80 Q38 58 60 50" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- the third eye -->
  <path d="M100 38 L100 30 M86 42 L80 36 M114 42 L120 36" stroke="#a77bff" stroke-width="3" stroke-linecap="round"/>
  <path d="M85 60 Q100 47 115 60 Q100 73 85 60 Z" fill="#ffffff" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="100" cy="60" r="6" fill="#7a4ad8" stroke="#2b1d3a" stroke-width="2"/>
  <circle cx="100" cy="60" r="2.6" fill="#2b1d3a"/><circle cx="102" cy="58" r="1.3" fill="#ffffff"/>
  <!-- eyes -->
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="74" cy="86" r="12.5" fill="#ffffff"/><circle cx="126" cy="86" r="12.5" fill="#ffffff"/></g>
  <circle cx="77" cy="88" r="7" fill="#2b1d3a"/><circle cx="123" cy="88" r="7" fill="#2b1d3a"/>
  <circle cx="79" cy="85" r="2.5" fill="#ffffff"/><circle cx="125" cy="85" r="2.5" fill="#ffffff"/>
  <path d="M54 68 L84 76 M146 68 L116 76" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="50" cy="100" rx="5.5" ry="3" fill="#ff9db8"/><ellipse cx="150" cy="100" rx="5.5" ry="3" fill="#ff9db8"/>
  <!-- the fold opening is its grin, the fortune poking out -->
  <path d="M72 110 Q100 124 128 110 Q118 128 100 134 Q82 128 72 110 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 113 l3 6 3 -4z M88 117 l3 5 3 -4z M114 116 l3 4 3 -6z" fill="#ffffff"/>
  <path d="M100 124 L114 118 L120 128 L106 132 Z" fill="#ffffff"/>
  <g fill="#ffc93c" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M16 18 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path d="M182 120 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M70 158 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
</svg>
