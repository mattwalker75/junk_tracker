<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rocket Pop, a red, white and blue rocket-shaped ice pop with fins, its wooden stick for a nozzle and a flame of melting drips, blasting past streaking stars">
  <defs>
    <clipPath id="rocket-pop-body"><path d="M100 12 Q134 34 136 76 L136 140 Q136 150 126 150 L74 150 Q64 150 64 140 L64 76 Q66 34 100 12 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="192" rx="44" ry="5" fill="#2b1d3a" opacity="0.12"/>
  <!-- streaking stars -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M26 78 L26 114"/><path d="M174 64 L174 100"/><path d="M184 130 L184 154"/><path d="M16 134 L16 152"/>
  </g>
  <!-- flame of melting drips -->
  <path d="M84 166 L116 166 Q124 176 118 182 Q114 186 111 180 Q108 190 100 190 Q92 190 89 180 Q86 186 82 182 Q76 176 84 166 Z" fill="#ff9a3c" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M91 168 L109 168 Q112 176 106 179 Q104 185 100 185 Q96 185 94 179 Q88 176 91 168 Z" fill="#ffd34d"/>
  <g stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M72 176 q-5 7 0 10 q5 -3 0 -10z" fill="#ff4d6d"/>
    <path d="M128 178 q-4 6 0 9 q4 -3 0 -9z" fill="#6ec6ff"/>
  </g>
  <!-- the stick, as a nozzle -->
  <path d="M90 146 L110 146 L115 168 L85 168 Z" fill="#e8c48a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M106 148 L111 166 L104 166 Z" fill="#c99a5a"/>
  <path d="M94 154 L96 162" stroke="#c99a5a" stroke-width="2" stroke-linecap="round"/>
  <!-- fins -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M66 110 L40 144 Q36 156 48 156 L66 148 Z" fill="#3a7bf0"/>
    <path d="M134 110 L160 144 Q164 156 152 156 L134 148 Z" fill="#2a62c9"/>
  </g>
  <!-- the striped pop -->
  <path d="M100 12 Q134 34 136 76 L136 140 Q136 150 126 150 L74 150 Q64 150 64 140 L64 76 Q66 34 100 12 Z" fill="#ffffff"/>
  <g clip-path="url(#rocket-pop-body)">
    <path d="M60 0 H140 V84 Q134 90 128 84 Q122 98 116 86 Q108 92 100 86 Q92 96 86 86 Q80 90 74 84 Q68 92 60 84 Z" fill="#ff4d6d"/>
    <path d="M60 118 Q70 114 80 118 Q90 122 100 118 Q110 114 120 118 Q130 122 140 118 V160 H60 Z" fill="#3a7bf0"/>
    <rect x="124" y="0" width="20" height="160" fill="#2b1d3a" opacity="0.16"/>
    <path d="M70 124 L70 144" stroke="#9cc4ff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M100 12 Q134 34 136 76 L136 140 Q136 150 126 150 L74 150 Q64 150 64 140 L64 76 Q66 34 100 12 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M84 34 Q88 28 96 22" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- face -->
  <path d="M74 46 L94 53 M126 46 L106 53" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="86" cy="64" r="11" fill="#ffffff"/><circle cx="114" cy="64" r="11" fill="#ffffff"/></g>
  <circle cx="88" cy="66" r="6.5" fill="#2b1d3a"/><circle cx="112" cy="66" r="6.5" fill="#2b1d3a"/>
  <circle cx="90" cy="63" r="2.4" fill="#ffffff"/><circle cx="114" cy="63" r="2.4" fill="#ffffff"/>
  <ellipse cx="74" cy="80" rx="5" ry="3" fill="#ffb3c6"/><ellipse cx="126" cy="80" rx="5" ry="3" fill="#ffb3c6"/>
  <path d="M80 100 Q100 118 120 100 Q100 106 80 100 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M86 102 l3 5 3 -4z M96 104 l3 5 3 -5z M106 103 l3 4 3 -5z" fill="#ffffff"/>
  <!-- sparkles at the heads of the streaks -->
  <g stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M26 56 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffc93c"/>
    <path d="M174 42 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#ffffff"/>
    <path d="M184 110 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffc93c"/>
  </g>
</svg>
