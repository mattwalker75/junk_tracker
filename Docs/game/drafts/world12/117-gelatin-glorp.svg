<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Gelatin Glorp, a wobbly lime-green gelatin alien with a moulded ridged top, three eyes on stalks and fruit bits suspended inside">
