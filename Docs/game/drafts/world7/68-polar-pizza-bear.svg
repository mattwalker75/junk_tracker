<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Polar Pizza Bear, a sleepy-eyed polar bear sitting on a giant frozen pizza, holding a frosty slice">
  <ellipse cx="100" cy="192" rx="86" ry="6" fill="#2b1d3a" opacity="0.18"/>
  <!-- the frozen pizza it sits on -->
  <ellipse cx="100" cy="170" rx="88" ry="22" fill="#e0a04a" stroke="#2b1d3a" stroke-width="4"/>
  <ellipse cx="100" cy="166" rx="76" ry="15" fill="#e2452b"/>
  <g fill="#ffd66b"><ellipse cx="54" cy="166" rx="12" ry="4"/><ellipse cx="146" cy="168" rx="11" ry="4"/><ellipse cx="100" cy="176" rx="14" ry="3.5"/></g>
  <g fill="#b52a2a" stroke="#ffffff" stroke-width="2"><ellipse cx="38" cy="172" rx="7" ry="3"/><ellipse cx="162" cy="172" rx="7" ry="3"/><ellipse cx="72" cy="178" rx="6" ry="2.6"/></g>
  <!-- body -->
  <ellipse cx="100" cy="128" rx="54" ry="44" fill="#f7fbff" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M136 98 Q160 120 148 160 Q140 166 130 164 Q150 130 128 100 Z" fill="#dbe8f2"/>
  <ellipse cx="100" cy="138" rx="28" ry="24" fill="#ffffff"/>
  <!-- feet with pads -->
  <g stroke="#2b1d3a" stroke-width="4" fill="#f7fbff"><ellipse cx="66" cy="164" rx="18" ry="12"/><ellipse cx="134" cy="164" rx="18" ry="12"/></g>
  <g fill="#c9a6b4"><ellipse cx="66" cy="166" rx="7" ry="5"/><ellipse cx="134" cy="166" rx="7" ry="5"/><circle cx="58" cy="158" r="2.5"/><circle cx="66" cy="156" r="2.5"/><circle cx="74" cy="158" r="2.5"/><circle cx="126" cy="158" r="2.5"/><circle cx="134" cy="156" r="2.5"/><circle cx="142" cy="158" r="2.5"/></g>
  <!-- ears and head -->
  <g stroke="#2b1d3a" stroke-width="4" fill="#f7fbff"><circle cx="68" cy="46" r="13"/><circle cx="132" cy="46" r="13"/></g>
  <circle cx="68" cy="46" r="6" fill="#ffc2d4"/><circle cx="132" cy="46" r="6" fill="#ffc2d4"/>
  <circle cx="100" cy="76" r="40" fill="#f7fbff" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M128 50 Q144 70 134 102 Q126 108 120 108 Q136 80 122 52 Z" fill="#dbe8f2"/>
  <path d="M72 52 Q80 42 94 40" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- heavy-lidded eyes: it wants to hibernate -->
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="84" cy="72" r="10" fill="#ffffff"/><circle cx="116" cy="72" r="10" fill="#ffffff"/></g>
  <circle cx="85" cy="76" r="5.5" fill="#2b1d3a"/><circle cx="115" cy="76" r="5.5" fill="#2b1d3a"/>
  <path d="M74 72 A10 10 0 0 1 94 72 Z M106 72 A10 10 0 0 1 126 72 Z" fill="#cfdfeb" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M70 62 L94 66 M130 62 L106 66" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="94" rx="20" ry="14" fill="#ffffff" stroke="#2b1d3a" stroke-width="3.5"/>
  <path d="M92 86 Q100 82 108 86 Q106 94 100 95 Q94 94 92 86 Z" fill="#2b1d3a"/>
  <path d="M100 95 L100 100 M92 102 Q100 108 108 102" fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="72" cy="88" rx="5" ry="3" fill="#ffc2d4"/><ellipse cx="128" cy="88" rx="5" ry="3" fill="#ffc2d4"/>
  <!-- a frosty slice in its paw -->
  <g stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round">
    <path d="M142 118 L182 100 L176 142 Z" fill="#ffd66b"/>
    <path d="M182 100 L176 142 L184 142 L190 100 Z" fill="#e0a04a"/>
  </g>
  <g fill="#b52a2a"><circle cx="164" cy="114" r="5"/><circle cx="170" cy="130" r="4"/></g>
  <path d="M152 120 l8 -3 M168 106 l5 -2" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="146" cy="128" r="12" fill="#f7fbff" stroke="#2b1d3a" stroke-width="4"/>
  <circle cx="54" cy="128" r="12" fill="#f7fbff" stroke="#2b1d3a" stroke-width="4"/>
  <!-- z z -->
  <g fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 18 L164 18 L150 32 L164 32"/><path d="M170 4 L180 4 L170 14 L180 14"/>
  </g>
  <g fill="#6ec6ff" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M24 70 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
  </g>
</svg>
