  <path d="M72 174 L72 146 Q72 118 100 118 Q128 118 128 146 L128 174 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M76 140 L82 150 L86 132 L92 146 L96 124 L100 142 L104 124 L108 146 L114 132 L118 150 L124 140 Q122 126 100 124 Q78 126 76 140 Z" fill="#e6f6ff" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
