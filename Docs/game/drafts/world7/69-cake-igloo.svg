    <path d="M150 40 Q172 70 170 140 L200 140 L200 30 Z" fill="#2b1d3a" opacity="0.12"/>
  </g>
  <path d="M22 172 Q22 40 100 40 Q178 40 178 172 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 52 Q74 44 88 44" fill="none" stroke="#a8704a" stroke-width="4" stroke-linecap="round"/>
  <!-- rosettes and the cherry -->
  <g fill="#ff9ec4" stroke="#2b1d3a" stroke-width="3"><circle cx="58" cy="58" r="8"/><circle cx="142" cy="58" r="8"/><circle cx="80" cy="44" r="8"/><circle cx="120" cy="44" r="8"/></g>
  <g fill="none" stroke="#ffd3e0" stroke-width="2"><path d="M56 56 q3 -3 5 1 M78 42 q3 -3 5 1 M118 42 q3 -3 5 1 M140 56 q3 -3 5 1"/></g>
  <path d="M102 30 Q108 16 120 12" fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="32" r="10" fill="#e2384d" stroke="#2b1d3a" stroke-width="3.5"/>
  <circle cx="97" cy="29" r="3" fill="#ff8fa0"/>
  <!-- eyes -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="72" cy="98" r="14" fill="#ffffff"/><circle cx="128" cy="98" r="14" fill="#ffffff"/></g>
  <circle cx="74" cy="101" r="8" fill="#2b1d3a"/><circle cx="126" cy="101" r="8" fill="#2b1d3a"/>
  <circle cx="77" cy="97" r="3" fill="#ffffff"/><circle cx="129" cy="97" r="3" fill="#ffffff"/>
  <path d="M54 80 L84 88 M146 80 L116 88" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="50" cy="120" rx="7" ry="4" fill="#ffc2d4"/><ellipse cx="150" cy="120" rx="7" ry="4" fill="#ffc2d4"/>
