<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cake Igloo, an igloo made of ice cream cake with fudge drips, frosting rosettes and a cherry, its doorway a mouth with icicle teeth">
