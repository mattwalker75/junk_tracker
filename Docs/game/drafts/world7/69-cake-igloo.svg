  </defs>
  <ellipse cx="100" cy="182" rx="88" ry="9" fill="#e6f6ff" stroke="#2b1d3a" stroke-width="3"/>
  <!-- the dome, in cake layers -->
  <g clip-path="url(#cake-igloo-dome)">
    <rect x="0" y="0" width="200" height="200" fill="#fffaf2"/>
    <rect x="0" y="138" width="200" height="40" fill="#5a3424"/>
    <path d="M0 136 L200 136" stroke="#3e2218" stroke-width="6" stroke-dasharray="4 5"/>
    <!-- ice blocks -->
    <g fill="none" stroke="#e6d8c4" stroke-width="3"><path d="M20 112 Q100 104 180 112"/><path d="M30 86 Q100 78 170 86"/><path d="M60 86 L58 112 M100 82 L100 108 M140 86 L142 112 M80 60 L78 84 M122 60 L124 84"/></g>
    <!-- fudge drip cap -->
