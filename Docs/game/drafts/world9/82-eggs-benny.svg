<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Eggs Benny, twin poached eggs on toasted English-muffin halves with pink ham, hollandaise dripping over them, one smug and one grumpy">
  <ellipse cx="100" cy="190" rx="86" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <g transform="translate(100 184) scale(1.14) translate(-96 -184)">
  <!-- one twin; the other is the same drawing shifted right -->
  <g id="eggs-benny-twin">
    <!-- toasted muffin half -->
    <path d="M16 162 Q16 152 26 152 Q34 148 42 152 Q50 148 58 152 Q66 148 74 152 Q82 148 90 152 Q100 152 100 162 L98 172 Q96 182 84 182 L32 182 Q20 182 18 172 Z" fill="#e8b46a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M18 164 Q58 172 98 164" fill="none" stroke="#c8853a" stroke-width="3" stroke-linecap="round"/>
    <path d="M88 166 Q96 166 95 172 Q93 179 84 179 Z" fill="#c8853a"/>
    <g fill="#c8853a"><ellipse cx="32" cy="174" rx="2.5" ry="1.8"/><ellipse cx="48" cy="177" rx="2" ry="1.5"/><ellipse cx="66" cy="175" rx="2.5" ry="1.8"/></g>
    <!-- ham -->
    <ellipse cx="58" cy="150" rx="40" ry="8" fill="#ff9ec4" stroke="#2b1d3a" stroke-width="3.5"/>
    <path d="M26 152 Q58 159 90 152" fill="none" stroke="#f27fa8" stroke-width="3" stroke-linecap="round"/>
    <!-- poached egg dome -->
    <path d="M24 150 Q20 86 58 84 Q96 86 92 150 Z" fill="#fffaf0" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M80 98 Q92 116 88 148 L80 148 Q84 120 80 98 Z" fill="#efe0c6"/>
    <!-- hollandaise -->
    <path d="M28 106 Q36 84 58 84 Q80 84 88 106 Q89 114 84 110 Q82 120 76 112 Q70 116 66 110 Q60 120 54 110 Q48 115 44 110 Q38 120 34 110 Q26 114 28 106 Z" fill="#ffd23f" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M38 98 Q44 90 54 89" fill="none" stroke="#fff6c2" stroke-width="4" stroke-linecap="round"/>
    <g fill="#e2384d"><circle cx="62" cy="94" r="1.6"/><circle cx="74" cy="99" r="1.6"/></g>
    <g stroke="#4caf50" stroke-width="2.2" stroke-linecap="round"><path d="M50 95 l3 -2"/><path d="M68 90 l2 3"/></g>
  </g>
  <use href="#eggs-benny-twin" transform="translate(76 0)"/>
  <!-- left twin: smug (lidded eyes, smirk) -->
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="46" cy="122" r="10" fill="#ffffff"/><circle cx="70" cy="122" r="10" fill="#ffffff"/></g>
  <circle cx="50" cy="125" r="5.5" fill="#2b1d3a"/><circle cx="74" cy="125" r="5.5" fill="#2b1d3a"/>
  <circle cx="52" cy="124" r="1.8" fill="#ffffff"/><circle cx="76" cy="124" r="1.8" fill="#ffffff"/>
  <path d="M36 121 A10 10 0 0 1 56 121 Z M60 121 A10 10 0 0 1 80 121 Z" fill="#f6ead2" stroke="#2b1d3a" stroke-width="3"/>
  <path d="M34 106 L52 110 M82 104 L66 110" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <path d="M46 137 Q60 143 74 133 Q62 138 46 137 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M62 138 l2 3 2 -4z M68 136 l2 3 2 -4z" fill="#ffffff"/>
  <ellipse cx="33" cy="134" rx="5" ry="3" fill="#ff9db8"/><ellipse cx="83" cy="134" rx="5" ry="3" fill="#ff9db8"/>
  <!-- right twin: grumpy (gritted teeth) -->
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="122" cy="122" r="10" fill="#ffffff"/><circle cx="146" cy="122" r="10" fill="#ffffff"/></g>
  <circle cx="124" cy="124" r="5.5" fill="#2b1d3a"/><circle cx="144" cy="124" r="5.5" fill="#2b1d3a"/>
  <circle cx="126" cy="121" r="2" fill="#ffffff"/><circle cx="146" cy="121" r="2" fill="#ffffff"/>
  <path d="M110 104 L130 112 M158 104 L138 112" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <rect x="123" y="133" width="22" height="8" rx="3" fill="#ffffff" stroke="#2b1d3a" stroke-width="3"/>
  <path d="M128.5 133 L128.5 141 M134 133 L134 141 M139.5 133 L139.5 141 M123 137 L145 137" stroke="#2b1d3a" stroke-width="2"/>
  <ellipse cx="110" cy="134" rx="5" ry="3" fill="#ff9db8"/><ellipse cx="158" cy="134" rx="5" ry="3" fill="#ff9db8"/>
  <!-- sparkles -->
  <g fill="#ffc93c" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M100 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M22 44 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M170 46 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
  </g>
</svg>
