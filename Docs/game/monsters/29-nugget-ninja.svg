<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nugget Ninja, a chicken-nugget ninja with a dip-cup headband and a throwing star">
  <ellipse cx="102" cy="188" rx="62" ry="7" fill="#2b1d3a" opacity="0.22"/>
  <!-- headband tails flying -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M150 70 Q172 56 190 62 Q178 70 176 78 Q162 76 150 80 Z" fill="#ff4d6d"/>
    <path d="M150 78 Q168 84 184 100 Q170 100 164 106 Q156 94 148 88 Z" fill="#e23b5a"/>
  </g>
  <!-- legs in a wide stance -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 156 L62 176" stroke="#2b1d3a" stroke-width="16"/>
    <path d="M78 156 L62 176" stroke="#3b2a55" stroke-width="8"/>
    <path d="M124 156 L142 176" stroke="#2b1d3a" stroke-width="16"/>
    <path d="M124 156 L142 176" stroke="#3b2a55" stroke-width="8"/>
  </g>
  <g stroke="#2b1d3a" stroke-width="4" fill="#3b2a55">
    <ellipse cx="56" cy="181" rx="15" ry="7"/><ellipse cx="148" cy="181" rx="15" ry="7"/>
  </g>
  <!-- the nugget -->
  <path d="M58 66 Q64 44 96 46 Q128 40 146 60 Q166 80 160 110 Q164 140 140 156 Q112 170 80 162 Q48 156 42 126 Q36 94 58 66 Z" fill="#f0a838" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M156 104 Q160 138 138 152 Q112 166 82 160 Q126 156 146 128 Q154 116 156 104 Z" fill="#d1801c"/>
  <path d="M52 112 Q50 84 70 64" fill="none" stroke="#ffd27a" stroke-width="7" stroke-linecap="round"/>
  <g fill="#c9741a">
    <circle cx="70" cy="136" r="2.6"/><circle cx="62" cy="122" r="2"/><circle cx="132" cy="140" r="2.6"/><circle cx="144" cy="118" r="2"/><circle cx="116" cy="56" r="2.2"/><circle cx="78" cy="58" r="2"/><circle cx="96" cy="150" r="2.4"/>
  </g>
  <g fill="#ffd27a">
    <circle cx="82" cy="146" r="2"/><circle cx="124" cy="152" r="1.8"/><circle cx="138" cy="70" r="2"/>
  </g>
  <!-- headband -->
  <path d="M48 82 Q100 66 156 74 L154 88 Q100 80 46 96 Z" fill="#ff4d6d" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M54 84 Q100 72 150 77" fill="none" stroke="#ffa0b4" stroke-width="3" stroke-linecap="round"/>
  <!-- dip cup on the headband -->
  <path d="M86 62 L114 62 L110 82 L90 82 Z" fill="#fff7e6" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="100" cy="62" rx="14" ry="5" fill="#ff7a2f" stroke="#2b1d3a" stroke-width="3.5"/>
  <ellipse cx="96" cy="61" rx="5" ry="1.6" fill="#ffb27a"/>
  <path d="M92 70 H108" stroke="#ff7a2f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ninja mask -->
  <path d="M50 100 Q100 86 152 98 L150 124 Q100 114 52 126 Z" fill="#3b2a55" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- eyes -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="80" cy="110" r="13" fill="#fff"/><circle cx="122" cy="108" r="13" fill="#fff"/></g>
  <circle cx="84" cy="112" r="7" fill="#2b1d3a"/><circle cx="118" cy="110" r="7" fill="#2b1d3a"/>
  <circle cx="86" cy="108" r="2.5" fill="#fff"/><circle cx="120" cy="106" r="2.5" fill="#fff"/>
  <path d="M64 96 L94 102 M138 94 L108 100" stroke="#fff7e6" stroke-width="4" stroke-linecap="round"/>
  <!-- smirk -->
  <path d="M90 138 Q102 146 116 134" fill="none" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M106 141 L108 148 L112 139 Z" fill="#fff" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="66" cy="138" r="5" fill="#ff6f6f" opacity="0.5"/><circle cx="140" cy="134" r="5" fill="#ff6f6f" opacity="0.5"/>
  <!-- belt -->
  <path d="M60 150 Q100 162 146 146" fill="none" stroke="#2b1d3a" stroke-width="10" stroke-linecap="round"/>
  <path d="M60 150 Q100 162 146 146" fill="none" stroke="#3b2a55" stroke-width="5" stroke-linecap="round"/>
  <!-- arms: left throws a star, right fist back -->
  <g fill="none" stroke-linecap="round">
    <path d="M48 118 Q30 116 26 100" stroke="#2b1d3a" stroke-width="12"/>
    <path d="M48 118 Q30 116 26 100" stroke="#f0a838" stroke-width="5"/>
    <path d="M156 122 Q170 132 168 146" stroke="#2b1d3a" stroke-width="12"/>
    <path d="M156 122 Q170 132 168 146" stroke="#f0a838" stroke-width="5"/>
  </g>
  <circle cx="168" cy="148" r="8" fill="#f0a838" stroke="#2b1d3a" stroke-width="4"/>
  <circle cx="26" cy="96" r="8" fill="#f0a838" stroke="#2b1d3a" stroke-width="4"/>
  <!-- throwing star -->
  <g transform="rotate(15 22 70)">
    <path d="M22 50 L27 65 L42 70 L27 75 L22 90 L17 75 L2 70 L17 65 Z" fill="#dfe8ef" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="22" cy="70" r="4" fill="#9fb3c4" stroke="#2b1d3a" stroke-width="2.5"/>
    <path d="M20 58 L22 64" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
