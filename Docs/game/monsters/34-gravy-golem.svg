  <path d="M60 44 Q100 30 140 44 Q144 54 136 56 Q138 70 130 72 Q122 72 124 60 Q104 64 86 60 Q88 78 78 78 Q70 78 72 62 Q64 60 62 56 Q54 52 60 44 Z" fill="#8a4b22" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M74 44 Q92 38 110 40" fill="none" stroke="#c0773e" stroke-width="3.5" stroke-linecap="round"/>
