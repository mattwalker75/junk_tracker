  </g>
  <!-- peas stuck in it -->
  <g fill="#7bd36b" stroke="#2b1d3a" stroke-width="2.5"><circle cx="66" cy="126" r="5"/><circle cx="138" cy="132" r="5"/><circle cx="84" cy="150" r="4"/></g>
  <g fill="#c8f0b0"><circle cx="64.5" cy="124.5" r="1.6"/><circle cx="136.5" cy="130.5" r="1.6"/></g>
