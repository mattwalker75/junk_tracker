  <circle cx="85" cy="89" r="7" fill="#2b1d3a"/><circle cx="115" cy="89" r="7" fill="#2b1d3a"/>
  <circle cx="87" cy="85" r="2.5" fill="#fff"/><circle cx="117" cy="85" r="2.5" fill="#fff"/>
  <path d="M90 104 Q100 110 110 104" fill="none" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M94 106 L96 111 L99 107 Z" fill="#fff" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="66" cy="100" r="5.5" fill="#ff8f7a" opacity="0.5"/><circle cx="134" cy="100" r="5.5" fill="#ff8f7a" opacity="0.5"/>
