    <path d="M100 34 Q74 20 56 30 Q70 32 74 40 Q62 40 54 50 Q76 46 96 46 Z" fill="#ff4d6d"/>
  </g>
  <path d="M90 40 Q76 34 66 36" fill="none" stroke="#ff9bb0" stroke-width="3" stroke-linecap="round"/>
  <path d="M86 18 Q100 4 114 18 Q118 32 100 42 Q82 32 86 18 Z" fill="#ff4d6d" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M88 12 L94 4 L100 10 L106 4 L112 12 Q100 16 88 12 Z" fill="#7bd36b" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#ffe08a"><circle cx="94" cy="22" r="1.6"/><circle cx="104" cy="20" r="1.6"/><circle cx="100" cy="30" r="1.6"/><circle cx="108" cy="28" r="1.4"/><circle cx="92" cy="30" r="1.4"/></g>
  <!-- helmet -->
  <path d="M50 84 Q48 40 100 38 Q152 40 150 84 Z" fill="#c9d6e2" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M132 48 Q146 60 146 82 L130 82 Q134 62 124 46 Z" fill="#9fb3c4"/>
  <path d="M62 70 Q64 52 80 45" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
