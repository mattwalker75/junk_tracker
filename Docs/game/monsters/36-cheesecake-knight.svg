<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cheesecake Knight, a cheesecake-slice knight in a silver helmet with a strawberry plume, a fork lance and a shield">
  <ellipse cx="100" cy="190" rx="68" ry="7" fill="#2b1d3a" opacity="0.22"/>
  <!-- fork lance -->
  <path d="M160 184 L160 52" stroke="#2b1d3a" stroke-width="12" stroke-linecap="round"/>
  <path d="M160 184 L160 52" stroke="#dfe8ef" stroke-width="6" stroke-linecap="round"/>
  <path d="M146 22 V42 Q146 54 160 54 Q174 54 174 42 V22 M155 22 V44 M165 22 V44" fill="none" stroke="#2b1d3a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
