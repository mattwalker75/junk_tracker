  <!-- raised visor -->
  <path d="M56 70 Q100 56 144 70 L146 80 Q100 68 54 80 Z" fill="#dfe8ef" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#2b1d3a"><circle cx="64" cy="74" r="1.8"/><circle cx="136" cy="74" r="1.8"/></g>
  <!-- cheesecake slice body -->
  <path d="M48 82 H152 V168 H48 Z" fill="#fff3d6" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M134 90 H148 V148 H132 C136 128 136 108 134 90 Z" fill="#f0dcae"/>
  <rect x="48" y="146" width="104" height="22" fill="#c98a4a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#9e6430"><circle cx="62" cy="156" r="2"/><circle cx="84" cy="160" r="1.8"/><circle cx="112" cy="155" r="2"/><circle cx="138" cy="160" r="1.8"/></g>
  <path d="M54 151 H70" stroke="#e0a868" stroke-width="3" stroke-linecap="round"/>
  <!-- strawberry glaze on top, dripping -->
  <path d="M46 80 H154 V90 Q150 100 146 90 Q142 108 136 92 Q128 98 122 90 Q116 104 110 90 Q100 98 92 90 Q86 106 80 90 Q72 98 66 90 Q60 104 54 90 Q50 96 46 90 Z" fill="#e8304f" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M54 84 H90" stroke="#ff8fa3" stroke-width="3" stroke-linecap="round"/>
  <!-- face -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="82" cy="114" r="13" fill="#fff"/><circle cx="118" cy="114" r="13" fill="#fff"/></g>
  <circle cx="85" cy="117" r="7" fill="#2b1d3a"/><circle cx="115" cy="117" r="7" fill="#2b1d3a"/>
  <circle cx="87" cy="113" r="2.5" fill="#fff"/><circle cx="117" cy="113" r="2.5" fill="#fff"/>
  <path d="M68 100 L94 104 M132 100 L106 104" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <path d="M88 132 Q100 142 112 132" fill="none" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M93 134 L95 140 L98 136 Z M102 136 L105 140 L107 134 Z" fill="#fff" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="66" cy="130" r="5.5" fill="#ff8fb0" opacity="0.6"/><circle cx="134" cy="130" r="5.5" fill="#ff8fb0" opacity="0.6"/>
  <!-- arm gripping the fork -->
  <path d="M150 130 Q158 128 160 118" fill="none" stroke="#2b1d3a" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 130 Q158 128 160 118" fill="none" stroke="#c9d6e2" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="114" r="8" fill="#c9d6e2" stroke="#2b1d3a" stroke-width="4"/>
  <!-- heater shield with a strawberry -->
  <path d="M14 104 Q30 98 46 104 L46 132 Q46 152 30 162 Q14 152 14 132 Z" fill="#ff8fb0" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M20 108 Q30 104 40 108 L40 130 Q40 146 30 154 Q20 146 20 130 Z" fill="none" stroke="#ffc93c" stroke-width="3"/>
  <path d="M30 120 Q38 120 38 128 Q36 138 30 142 Q24 138 22 128 Q22 120 30 120 Z" fill="#e8304f" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M25 120 L30 115 L35 120 Z" fill="#7bd36b" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"/>
</svg>
