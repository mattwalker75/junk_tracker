<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Taffy Stretch, a striped pink-and-mint taffy blob pulling its own gooey arms out long to both sides">
  <defs>
    <clipPath id="taffy-stretch-body"><path d="M60 90 Q100 74 140 90 Q152 130 142 168 Q100 184 58 168 Q48 130 60 90 Z"/></clipPath>
    <clipPath id="taffy-stretch-arms">
      <path d="M64 106 Q44 124 30 100 Q26 112 28 122 Q44 118 64 142 Z"/>
      <path d="M136 106 Q156 124 170 100 Q174 112 172 122 Q156 118 136 142 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="100" cy="188" rx="58" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <!-- thin taffy strings sagging under the arms -->
  <g fill="none" stroke-linecap="round">
    <path d="M32 120 Q44 152 62 156" stroke="#2b1d3a" stroke-width="7"/>
    <path d="M168 120 Q156 152 138 156" stroke="#2b1d3a" stroke-width="7"/>
    <path d="M32 120 Q44 152 62 156" stroke="#ffa8c8" stroke-width="2.5"/>
    <path d="M168 120 Q156 152 138 156" stroke="#ffa8c8" stroke-width="2.5"/>
  </g>
  <!-- arms pulled long, pinched thin in the middle -->
  <g fill="#ffa8c8" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M64 106 Q44 124 30 100 Q26 112 28 122 Q44 118 64 142 Z"/>
    <path d="M136 106 Q156 124 170 100 Q174 112 172 122 Q156 118 136 142 Z"/>
  </g>
  <g clip-path="url(#taffy-stretch-arms)" fill="none" stroke-linecap="round">
    <path d="M26 110 Q46 120 66 126" stroke="#8fe3c4" stroke-width="5"/>
    <path d="M174 110 Q154 120 134 126" stroke="#8fe3c4" stroke-width="5"/>
  </g>
  <!-- gooey hands gripping the ends -->
  <g fill="#ffa8c8" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M30 98 C18 92 6 98 6 110 C6 122 18 130 30 126 C36 120 36 104 30 98 Z"/>
    <path d="M170 98 C182 92 194 98 194 110 C194 122 182 130 170 126 C164 120 164 104 170 98 Z"/>
  </g>
  <g fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round">
    <path d="M8 106 Q14 108 18 104 M8 116 Q14 118 18 114"/><path d="M192 106 Q186 108 182 104 M192 116 Q186 118 182 114"/>
  </g>
  <!-- feet -->
  <g fill="#ffa8c8" stroke="#2b1d3a" stroke-width="4"><ellipse cx="78" cy="180" rx="15" ry="9"/><ellipse cx="122" cy="180" rx="15" ry="9"/></g>
  <!-- pulled tip on top of the head -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 86 C94 66 112 52 122 60 C128 66 120 74 114 70" stroke="#2b1d3a" stroke-width="15"/>
    <path d="M98 86 C94 66 112 52 122 60 C128 66 120 74 114 70" stroke="#ffa8c8" stroke-width="7"/>
    <path d="M102 64 Q108 58 116 58" stroke="#ffe0ec" stroke-width="3"/>
  </g>
  <!-- the taffy body -->
  <path d="M60 90 Q100 74 140 90 Q152 130 142 168 Q100 184 58 168 Q48 130 60 90 Z" fill="#ffa8c8"/>
  <g clip-path="url(#taffy-stretch-body)">
    <g fill="none" stroke-linecap="round">
      <path d="M40 96 Q100 82 160 96" stroke="#8fe3c4" stroke-width="9"/>
      <path d="M40 106 Q100 92 160 106" stroke="#ffffff" stroke-width="4"/>
      <path d="M40 164 Q100 150 160 164" stroke="#8fe3c4" stroke-width="9"/>
      <path d="M40 174 Q100 160 160 174" stroke="#ffffff" stroke-width="4"/>
    </g>
    <path d="M130 84 Q150 130 136 176 L170 176 L170 80 Z" fill="#e8749f"/>
  </g>
  <path d="M60 90 Q100 74 140 90 Q152 130 142 168 Q100 184 58 168 Q48 130 60 90 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 124 Q60 108 66 100" fill="none" stroke="#ffe0ec" stroke-width="5" stroke-linecap="round"/>
  <!-- face -->
  <path d="M70 108 L92 114 M130 108 L108 114" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <g stroke="#2b1d3a" stroke-width="4"><ellipse cx="83" cy="127" rx="13" ry="14" fill="#ffffff"/><ellipse cx="117" cy="127" rx="13" ry="14" fill="#ffffff"/></g>
  <circle cx="86" cy="130" r="7.5" fill="#2b1d3a"/><circle cx="114" cy="130" r="7.5" fill="#2b1d3a"/>
  <circle cx="89" cy="126" r="2.8" fill="#ffffff"/><circle cx="117" cy="126" r="2.8" fill="#ffffff"/><circle cx="83" cy="134" r="1.4" fill="#ffffff"/><circle cx="111" cy="134" r="1.4" fill="#ffffff"/>
  <ellipse cx="66" cy="144" rx="5.5" ry="3.5" fill="#ff6f9f"/><ellipse cx="134" cy="144" rx="5.5" ry="3.5" fill="#ff6f9f"/>
  <!-- a long stretchy grin -->
  <path d="M76 146 Q100 166 124 146 Q100 154 76 146 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M82 148 l4 6 4 -5z M118 148 l-4 6 -4 -5z" fill="#ffffff"/>
  <path d="M94 157 Q100 153 106 157 Q100 162 94 157 Z" fill="#ff6f9f"/>
  <!-- strain marks: it is still pulling -->
  <g fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round">
    <path d="M10 88 l-4 -6 M20 86 l0 -8"/><path d="M190 88 l4 -6 M180 86 l0 -8"/>
  </g>
</svg>
