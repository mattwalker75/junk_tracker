<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Choco Bunny, a hollow chocolate bunny brute with a bite out of one ear, a red bow and big buck teeth">
  <defs>
    <clipPath id="choco-bunny-head"><circle cx="100" cy="88" r="38"/></clipPath>
    <clipPath id="choco-bunny-body"><path d="M54 178 C44 144 62 116 100 116 C138 116 156 144 146 178 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="188" rx="60" ry="7" fill="#2b1d3a" opacity="0.2"/>
  <!-- ears: the left one whole, the right one bitten off at the tip -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M78 62 C64 44 60 18 70 10 C82 2 94 26 94 56 Z" fill="#a0612f"/>
    <path d="M106 56 C106 44 108 34 112 28 Q114 32 118 30 Q120 34 124 32 Q126 36 130 36 C132 46 128 56 122 62 Z" fill="#a0612f"/>
  </g>
  <path d="M80 52 C72 40 70 24 74 18 C80 16 86 34 86 52 Z" fill="#e89aa8"/>
  <!-- the bite shows it's hollow inside -->
  <path d="M112 28 Q114 32 118 30 Q120 34 124 32 Q126 36 130 36 C128 40 122 40 118 38 C114 36 112 32 112 28 Z" fill="#4a2616" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M114 44 C116 38 122 40 124 46" fill="none" stroke="#d29a64" stroke-width="3" stroke-linecap="round"/>
  <g fill="#7a4520"><circle cx="138" cy="26" r="2.5"/><circle cx="144" cy="34" r="1.8"/><circle cx="134" cy="16" r="1.6"/></g>
  <!-- feet -->
  <g fill="#a0612f" stroke="#2b1d3a" stroke-width="4"><ellipse cx="72" cy="180" rx="20" ry="10"/><ellipse cx="128" cy="180" rx="20" ry="10"/></g>
  <g fill="#c98a55"><ellipse cx="66" cy="180" rx="5" ry="4"/><ellipse cx="78" cy="181" rx="4" ry="3.5"/><ellipse cx="134" cy="180" rx="5" ry="4"/><ellipse cx="122" cy="181" rx="4" ry="3.5"/></g>
  <!-- chunky body -->
  <path d="M54 178 C44 144 62 116 100 116 C138 116 156 144 146 178 Z" fill="#a0612f"/>
  <g clip-path="url(#choco-bunny-body)">
    <path d="M124 118 C150 132 156 160 146 182 L120 182 C138 160 138 136 124 118 Z" fill="#7a4520"/>
    <ellipse cx="100" cy="156" rx="26" ry="22" fill="#c98a55"/>
    <path d="M86 150 Q100 144 114 150 M86 162 Q100 156 114 162" fill="none" stroke="#a0612f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <path d="M54 178 C44 144 62 116 100 116 C138 116 156 144 146 178 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- brute arms with fists -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" fill="#a0612f">
    <path d="M62 126 C42 130 34 144 34 158 L50 160 C50 150 56 142 66 140 Z"/>
    <path d="M138 126 C158 130 166 144 166 158 L150 160 C150 150 144 142 134 140 Z"/>
    <circle cx="40" cy="162" r="14"/><circle cx="160" cy="162" r="14"/>
  </g>
  <path d="M32 158 h10 M34 166 h10 M168 158 h-10 M166 166 h-10" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 154 Q36 150 42 150" fill="none" stroke="#d29a64" stroke-width="3" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="100" cy="88" r="38" fill="#a0612f"/>
  <g clip-path="url(#choco-bunny-head)">
    <path d="M118 52 C144 62 146 106 120 128 L150 128 L150 50 Z" fill="#7a4520"/>
  </g>
  <circle cx="100" cy="88" r="38" fill="none" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M70 76 Q74 60 90 54" fill="none" stroke="#d29a64" stroke-width="6" stroke-linecap="round"/>
  <!-- red bow at the neck -->
  <g stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round">
    <path d="M100 122 L76 110 L78 134 Z" fill="#ff4d6d"/>
    <path d="M100 122 L124 110 L122 134 Z" fill="#ff4d6d"/>
    <circle cx="100" cy="122" r="7" fill="#ffc93c"/>
  </g>
  <path d="M80 116 l6 4" stroke="#ffb3c1" stroke-width="3" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="104" rx="18" ry="12" fill="#c98a55" stroke="#2b1d3a" stroke-width="3.5"/>
  <path d="M94 96 L106 96 L100 102 Z" fill="#ff8fab" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M100 102 V106 M100 106 Q94 112 88 106 M100 106 Q106 112 112 106" fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round"/>
  <path d="M94 108 h12 v8 a2 2 0 0 1 -2 2 h-8 a2 2 0 0 1 -2 -2 z" fill="#ffffff" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M100 108 V117" stroke="#2b1d3a" stroke-width="2"/>
  <!-- eyes and angry brows -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="84" cy="84" r="13" fill="#ffffff"/><circle cx="116" cy="84" r="13" fill="#ffffff"/></g>
  <circle cx="87" cy="87" r="7.5" fill="#2b1d3a"/><circle cx="113" cy="87" r="7.5" fill="#2b1d3a"/>
  <circle cx="90" cy="83" r="2.8" fill="#ffffff"/><circle cx="116" cy="83" r="2.8" fill="#ffffff"/><circle cx="84" cy="91" r="1.4" fill="#ffffff"/><circle cx="110" cy="91" r="1.4" fill="#ffffff"/>
  <path d="M68 68 L94 76 M132 68 L106 76" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="70" cy="102" rx="5" ry="3" fill="#e0707f" opacity="0.7"/><ellipse cx="130" cy="102" rx="5" ry="3" fill="#e0707f" opacity="0.7"/>
</svg>
