  <circle cx="100" cy="136" r="17" fill="#dff7ff" stroke="#2b1d3a" stroke-width="3.5"/>
  <path d="M90 128 Q94 122 102 122" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="108" cy="142" r="2.5" fill="#ffffff" stroke="#2b1d3a" stroke-width="1.5"/>
  <!-- front hands -->
  <g fill="#9be15d" stroke="#2b1d3a" stroke-width="3.5">
    <circle cx="66" cy="164" r="6"/><circle cx="76" cy="166" r="6"/><circle cx="56" cy="164" r="5.5"/>
    <circle cx="134" cy="164" r="6"/><circle cx="124" cy="166" r="6"/><circle cx="144" cy="164" r="5.5"/>
  </g>
  <!-- fizz rising off its head -->
  <g fill="#dff7ff" stroke="#2b1d3a" stroke-width="2.5">
    <circle cx="100" cy="40" r="6"/><circle cx="90" cy="22" r="4"/><circle cx="108" cy="12" r="3"/><circle cx="160" cy="28" r="5"/><circle cx="172" cy="14" r="3"/><circle cx="32" cy="34" r="4"/>
  </g>
  <g fill="#ffffff"><circle cx="98" cy="38" r="1.6"/><circle cx="158" cy="26" r="1.4"/></g>
</svg>
