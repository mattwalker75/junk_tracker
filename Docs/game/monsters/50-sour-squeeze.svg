<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sour Squeeze, a lemon-shaped lemonade pitcher with a spout, a handle, ice cubes on top and a puckered sour face">
  <defs>
    <clipPath id="sour-squeeze-body"><path d="M100 54 C146 54 164 90 162 122 C160 158 134 180 100 180 C66 180 40 158 38 122 C36 90 54 54 100 54 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="190" rx="54" ry="6" fill="#2b1d3a" opacity="0.18"/>
  <!-- sour drops flying off -->
  <g fill="#fff36b" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M22 84 q-6 9 0 12 q6 -3 0 -12z"/><path d="M180 70 q-6 9 0 12 q6 -3 0 -12z"/><path d="M188 100 q-4 6 0 8 q4 -2 0 -8z"/>
  </g>
  <!-- handle -->
  <path d="M156 92 C188 88 190 140 156 148" fill="none" stroke="#2b1d3a" stroke-width="17" stroke-linecap="round"/>
  <path d="M156 92 C188 88 190 140 156 148" fill="none" stroke="#ffe14d" stroke-width="9" stroke-linecap="round"/>
  <!-- little feet -->
  <g fill="#ffd21f" stroke="#2b1d3a" stroke-width="4"><ellipse cx="78" cy="182" rx="14" ry="8"/><ellipse cx="122" cy="182" rx="14" ry="8"/></g>
  <!-- the lemon body -->
  <path d="M100 54 C146 54 164 90 162 122 C160 158 134 180 100 180 C66 180 40 158 38 122 C36 90 54 54 100 54 Z" fill="#ffe14d"/>
  <g clip-path="url(#sour-squeeze-body)">
    <path d="M136 62 C170 92 166 160 116 184 L180 186 L180 50 Z" fill="#f2b705"/>
    <g fill="#f2c400"><circle cx="58" cy="140" r="2"/><circle cx="68" cy="156" r="1.6"/><circle cx="132" cy="150" r="2"/><circle cx="146" cy="124" r="1.6"/><circle cx="52" cy="112" r="1.6"/><circle cx="126" cy="166" r="1.6"/></g>
  </g>
  <path d="M100 54 C146 54 164 90 162 122 C160 158 134 180 100 180 C66 180 40 158 38 122 C36 90 54 54 100 54 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M50 116 Q52 90 70 76" fill="none" stroke="#fff8c4" stroke-width="6" stroke-linecap="round"/>
  <!-- spout on the left of the rim -->
  <path d="M66 62 L34 48 Q30 54 38 62 L62 76 Z" fill="#ffe14d" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- open top: lemonade and ice -->
  <ellipse cx="100" cy="62" rx="40" ry="11" fill="#fff6a8" stroke="#2b1d3a" stroke-width="4"/>
  <g stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round">
    <path d="M78 46 L94 42 L98 56 L82 60 Z" fill="#dff7ff"/>
    <path d="M104 44 L118 48 L114 62 L100 58 Z" fill="#dff7ff"/>
  </g>
  <path d="M82 48 l8 -2 M108 48 l6 2" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- lemon slice on the rim -->
  <path d="M120 60 A16 16 0 0 1 150 52 Z" fill="#ffe14d" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M124 58 A12 12 0 0 1 146 52 Z" fill="#fff6a8"/>
  <path d="M135 55 L130 47 M135 55 L138 46 M135 55 L144 49" stroke="#f2b705" stroke-width="2" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M86 62 C78 50 62 50 58 56 C64 64 76 66 86 62 Z" fill="#7bd36b" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <!-- squinty sour eyes -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="80" cy="108" r="15" fill="#ffffff"/><circle cx="120" cy="108" r="15" fill="#ffffff"/></g>
  <circle cx="82" cy="112" r="8.5" fill="#2b1d3a"/><circle cx="118" cy="112" r="8.5" fill="#2b1d3a"/>
  <circle cx="85" cy="108" r="3" fill="#ffffff"/><circle cx="121" cy="108" r="3" fill="#ffffff"/><circle cx="79" cy="116" r="1.5" fill="#ffffff"/><circle cx="115" cy="116" r="1.5" fill="#ffffff"/>
  <!-- heavy sour eyelids pulled down -->
  <path d="M64.6 104 A15.5 15.5 0 0 1 95.4 104 Z" fill="#ffe14d" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M104.6 104 A15.5 15.5 0 0 1 135.4 104 Z" fill="#ffe14d" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 86 Q70 80 80 88 M140 86 Q130 80 120 88" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linecap="round"/>
  <!-- pucker -->
  <ellipse cx="100" cy="140" rx="10" ry="9" fill="#ff6f9f" stroke="#2b1d3a" stroke-width="4"/>
  <ellipse cx="100" cy="140" rx="3.5" ry="3" fill="#2b1d3a"/>
  <g stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"><path d="M86 134 l-4 -2 M86 146 l-4 2 M114 134 l4 -2 M114 146 l4 2"/></g>
  <ellipse cx="64" cy="132" rx="6" ry="3.5" fill="#ff9d6b" opacity="0.8"/><ellipse cx="136" cy="132" rx="6" ry="3.5" fill="#ff9d6b" opacity="0.8"/>
  <!-- tiny arms squeezing its own cheeks -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" fill="#ffe14d">
    <path d="M42 148 Q34 138 44 130 Q52 128 54 136 Q50 144 42 148 Z"/>
    <path d="M152 156 Q162 150 160 140 Q154 134 148 140 Q146 150 152 156 Z"/>
  </g>
</svg>
