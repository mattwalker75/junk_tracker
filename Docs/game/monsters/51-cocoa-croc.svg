<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cocoa Croc, a green hot-cocoa-mug crocodile with its tail as the handle, jaws open on a pool of cocoa and marshmallow teeth">
  <defs>
    <clipPath id="cocoa-croc-mug"><path d="M50 106 H150 V162 Q150 182 130 182 H70 Q50 182 50 162 Z"/></clipPath>
    <clipPath id="cocoa-croc-head"><path d="M46 98 C40 66 54 40 80 38 C94 37 104 40 110 44 L172 20 Q190 14 194 26 Q196 38 184 44 L62 100 Z"/></clipPath>
  </defs>
  <ellipse cx="96" cy="188" rx="56" ry="6" fill="#2b1d3a" opacity="0.18"/>
  <g transform="translate(-4 4) translate(100 110) scale(0.86) translate(-100 -110)">
  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M118 30 q-6 -8 0 -14 q6 -6 0 -14"/><path d="M134 22 q-5 -6 0 -11"/>
  </g>
  <g fill="none" stroke="#2b1d3a" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <path d="M122 30 q-6 -8 0 -14"/>
  </g>
  <!-- tail curled into a mug handle -->
  <path d="M54 118 C26 112 16 138 26 154 C34 166 48 168 54 160" fill="none" stroke="#2b1d3a" stroke-width="18" stroke-linecap="round"/>
  <path d="M54 118 C26 112 16 138 26 154 C34 166 48 168 54 160" fill="none" stroke="#5cc46e" stroke-width="10" stroke-linecap="round"/>
  <g fill="#3e9a55" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M30 120 l-8 -6 2 10z"/><path d="M18 138 l-10 -2 7 8z"/><path d="M20 156 l-9 4 10 3z"/>
  </g>
  <!-- stubby feet -->
  <g fill="#5cc46e" stroke="#2b1d3a" stroke-width="4"><ellipse cx="72" cy="182" rx="15" ry="8"/><ellipse cx="128" cy="182" rx="15" ry="8"/></g>
  <g fill="#fffaf2" stroke="#2b1d3a" stroke-width="2"><path d="M62 186 l-3 4 6 -1z"/><path d="M138 186 l3 4 -6 -1z"/></g>
  <!-- the mug body -->
  <path d="M50 106 H150 V162 Q150 182 130 182 H70 Q50 182 50 162 Z" fill="#5cc46e"/>
  <g clip-path="url(#cocoa-croc-mug)">
    <path d="M128 104 H156 V186 H118 C134 160 134 130 128 104 Z" fill="#3e9a55"/>
    <path d="M70 120 Q100 112 130 120 Q132 160 100 172 Q68 160 70 120 Z" fill="#c8f0a8"/>
    <g fill="none" stroke="#8fd07a" stroke-width="2.5" stroke-linecap="round"><path d="M76 132 Q100 126 124 132"/><path d="M78 146 Q100 140 122 146"/><path d="M84 160 Q100 155 116 160"/></g>
    <g fill="#3e9a55"><circle cx="60" cy="128" r="3"/><circle cx="62" cy="146" r="2.5"/><circle cx="140" cy="130" r="2.5"/><circle cx="142" cy="150" r="3"/></g>
  </g>
  <path d="M50 106 H150 V162 Q150 182 130 182 H70 Q50 182 50 162 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M58 124 V158" stroke="#b6eeb0" stroke-width="5" stroke-linecap="round"/>
  <!-- lower jaw resting on the rim -->
  <path d="M44 100 L176 94 Q192 94 192 104 Q192 114 176 114 L52 116 Q42 112 44 100 Z" fill="#5cc46e" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 110 L176 108" stroke="#3e9a55" stroke-width="4" stroke-linecap="round"/>
  <!-- open mouth: a pool of cocoa -->
  <path d="M58 100 L184 44 Q196 56 190 76 L176 96 Z" fill="#4a2616" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M72 98 Q130 76 190 72 Q190 86 176 96 Z" fill="#8a4f2a"/>
  <path d="M100 92 Q140 80 182 78" fill="none" stroke="#b57a4a" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fffaf2" stroke="#2b1d3a" stroke-width="2"><rect x="136" y="80" width="10" height="8" rx="3" transform="rotate(-10 141 84)"/><rect x="160" y="76" width="9" height="7" rx="2.5" transform="rotate(14 164 80)"/></g>
  <!-- marshmallow teeth -->
  <g fill="#fffaf2" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round">
    <rect x="84" y="87" width="11" height="11" rx="3.5" transform="rotate(-24 89 92)"/>
    <rect x="108" y="76" width="11" height="11" rx="3.5" transform="rotate(-24 113 81)"/>
    <rect x="132" y="65" width="11" height="11" rx="3.5" transform="rotate(-24 137 70)"/>
    <rect x="156" y="54" width="10" height="10" rx="3" transform="rotate(-24 161 59)"/>
    <rect x="96" y="87" width="11" height="10" rx="3.5"/>
    <rect x="118" y="86" width="11" height="10" rx="3.5"/>
  </g>
  <!-- upper jaw and head -->
  <path d="M46 98 C40 66 54 40 80 38 C94 37 104 40 110 44 L172 20 Q190 14 194 26 Q196 38 184 44 L62 100 Z" fill="#5cc46e"/>
  <g clip-path="url(#cocoa-croc-head)">
    <path d="M40 84 Q110 68 198 32 L198 60 L40 110 Z" fill="#3e9a55"/>
  </g>
  <path d="M46 98 C40 66 54 40 80 38 C94 37 104 40 110 44 L172 20 Q190 14 194 26 Q196 38 184 44 L62 100 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M118 44 L168 25" stroke="#b6eeb0" stroke-width="4" stroke-linecap="round"/>
  <!-- back ridges -->
  <g fill="#3e9a55" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M120 40 l1 -9 8 5z"/><path d="M136 34 l1 -9 8 5z"/><path d="M152 28 l1 -8 7 4z"/>
  </g>
  <!-- nostrils -->
  <g fill="#5cc46e" stroke="#2b1d3a" stroke-width="3"><circle cx="178" cy="18" r="5"/><circle cx="189" cy="18" r="4"/></g>
  <g fill="#2b1d3a"><circle cx="178" cy="18" r="1.6"/><circle cx="189" cy="18" r="1.3"/></g>
  <!-- eyes on top of the head -->
  <g fill="#5cc46e" stroke="#2b1d3a" stroke-width="4"><circle cx="66" cy="46" r="18"/><circle cx="98" cy="42" r="16"/></g>
  <g fill="#5cc46e"><path d="M50 56 H112 V66 H50 Z"/></g>
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="66" cy="48" r="13" fill="#ffffff"/><circle cx="98" cy="44" r="12" fill="#ffffff"/></g>
  <circle cx="70" cy="51" r="7.5" fill="#2b1d3a"/><circle cx="101" cy="47" r="7" fill="#2b1d3a"/>
  <circle cx="73" cy="47" r="2.8" fill="#ffffff"/><circle cx="104" cy="43" r="2.6" fill="#ffffff"/>
  <path d="M50 34 L80 40 M86 32 L112 38" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="62" cy="76" rx="6" ry="3.5" fill="#ff8fab"/>
  </g>
</svg>
