  <g stroke="#2b1d3a" stroke-width="4">
    <circle cx="68" cy="40" r="14" fill="#fff3d6"/><circle cx="132" cy="40" r="14" fill="#fff3d6"/>
  </g>
  <g fill="#ffc2d4"><circle cx="68" cy="40" r="7"/><circle cx="132" cy="40" r="7"/></g>
  <circle cx="100" cy="72" r="40" fill="#fff3d6"/>
  <g clip-path="url(#float-bear-scoop)">
