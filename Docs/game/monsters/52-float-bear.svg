  </g>
  <circle cx="100" cy="72" r="40" fill="none" stroke="#2b1d3a" stroke-width="4"/>
  <!-- the scoop's ruffled bottom edge, melting onto the foam -->
  <!-- foam collar -->
  <g fill="#2b1d3a">
    <circle cx="58" cy="110" r="12"/><circle cx="76" cy="114" r="12"/><circle cx="96" cy="118" r="12"/><circle cx="116" cy="117" r="12"/><circle cx="134" cy="114" r="12"/><circle cx="146" cy="108" r="10"/>
  </g>
  <g fill="#f3dcb0">
