  <g fill="#fff3d6" stroke="#2b1d3a" stroke-width="4">
    <ellipse cx="58" cy="148" rx="10" ry="12"/><ellipse cx="142" cy="146" rx="9" ry="11"/>
  </g>
  <path d="M54 142 Q58 140 62 142 M138 140 Q142 138 146 140" fill="none" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
