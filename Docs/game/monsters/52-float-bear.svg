    <rect x="58" y="108" width="86" height="12"/>
  </g>
  <path d="M118 108 v16 a5 5 0 0 0 10 0 v-18" fill="#fff3d6" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M119.8 110 h6.4" stroke="#fff3d6" stroke-width="6"/>
  <path d="M68 56 Q74 40 90 36" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- face -->
  <ellipse cx="100" cy="88" rx="16" ry="11" fill="#ffffff" stroke="#2b1d3a" stroke-width="3.5"/>
  <ellipse cx="100" cy="83" rx="6" ry="4.5" fill="#7a3e1e" stroke="#2b1d3a" stroke-width="2.5"/>
  <path d="M90 92 Q100 102 110 92 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M93 93 l2 4 2 -3z M107 93 l-2 4 -2 -3z" fill="#ffffff"/>
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="82" cy="68" r="12" fill="#ffffff"/><circle cx="118" cy="68" r="12" fill="#ffffff"/></g>
  <circle cx="84" cy="71" r="7" fill="#2b1d3a"/><circle cx="116" cy="71" r="7" fill="#2b1d3a"/>
  <circle cx="87" cy="67" r="2.6" fill="#ffffff"/><circle cx="119" cy="67" r="2.6" fill="#ffffff"/><circle cx="82" cy="74" r="1.3" fill="#ffffff"/><circle cx="114" cy="74" r="1.3" fill="#ffffff"/>
  <path d="M68 54 L92 60 M132 54 L108 60" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="70" cy="86" rx="5.5" ry="3.5" fill="#ff9db8"/><ellipse cx="130" cy="86" rx="5.5" ry="3.5" fill="#ff9db8"/>
