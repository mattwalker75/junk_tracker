    <path d="M124 112 H150 V190 H118 C130 160 130 136 124 112 Z" fill="#5a2a12"/>
    <path d="M56 112 H144 L144 120 L56 120 Z" fill="#dff4ff" opacity="0.5"/>
    <g fill="#c98a55" stroke="#2b1d3a" stroke-width="1.5"><circle cx="76" cy="160" r="3.5"/><circle cx="86" cy="146" r="2.5"/><circle cx="118" cy="168" r="3"/><circle cx="108" cy="152" r="2"/><circle cx="72" cy="136" r="2"/></g>
    <rect x="62" y="114" width="8" height="66" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="74" y="116" width="4" height="40" rx="2" fill="#ffffff" opacity="0.4"/>
  </g>
  <path d="M56 112 H144 L140 172 Q139 184 126 184 H74 Q61 184 60 172 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
