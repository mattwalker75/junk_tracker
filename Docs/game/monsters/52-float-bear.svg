<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Float Bear, a root-beer-float bear: a frosty glass mug of fizzy root beer with a vanilla ice-cream scoop for a head">
  <defs>
    <clipPath id="float-bear-glass"><path d="M56 112 H144 L140 172 Q139 184 126 184 H74 Q61 184 60 172 Z"/></clipPath>
    <clipPath id="float-bear-scoop"><circle cx="100" cy="72" r="40"/></clipPath>
  </defs>
  <ellipse cx="100" cy="190" rx="56" ry="6" fill="#2b1d3a" opacity="0.18"/>
  <!-- straw poking out behind the head -->
  <g fill="none" stroke-linecap="round">
    <path d="M128 96 L150 20" stroke="#2b1d3a" stroke-width="13"/>
    <path d="M128 96 L150 20" stroke="#ffffff" stroke-width="6"/>
    <path d="M128 96 L150 20" stroke="#ff4d6d" stroke-width="6" stroke-dasharray="6 6" stroke-linecap="butt"/>
  </g>
  <!-- mug handle -->
  <path d="M142 124 C170 120 172 166 140 166" fill="none" stroke="#2b1d3a" stroke-width="17" stroke-linecap="round"/>
  <path d="M142 124 C170 120 172 166 140 166" fill="none" stroke="#dff4ff" stroke-width="9" stroke-linecap="round"/>
  <!-- frosty glass mug of root beer -->
  <path d="M56 112 H144 L140 172 Q139 184 126 184 H74 Q61 184 60 172 Z" fill="#dff4ff"/>
  <g clip-path="url(#float-bear-glass)">
