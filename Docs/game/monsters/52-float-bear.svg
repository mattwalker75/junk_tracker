  <path d="M102 34 Q104 20 116 14" fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="34" r="8" fill="#ff4d6d" stroke="#2b1d3a" stroke-width="3.5"/>
  <circle cx="97" cy="31" r="2.2" fill="#ffffff"/>
  <!-- fizz -->
  <g fill="#dff4ff" stroke="#2b1d3a" stroke-width="2.5">
    <circle cx="30" cy="120" r="5"/><circle cx="22" cy="104" r="3"/><circle cx="176" cy="96" r="4"/><circle cx="182" cy="80" r="2.5"/>
  </g>
