<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pancake Bot, a robot made of a pancake stack with syrup drips, a butter-pat warning light and a spatula hand">
  <ellipse cx="100" cy="190" rx="62" ry="6" fill="#2b1d3a" opacity="0.22"/>
  <!-- piston legs -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <rect x="68" y="154" width="16" height="22" rx="3" fill="#b8c4d0"/><rect x="116" y="154" width="16" height="22" rx="3" fill="#b8c4d0"/>
    <path d="M56 186 Q56 174 76 174 Q96 174 96 186 Z" fill="#7d8ea0"/><path d="M104 186 Q104 174 124 174 Q144 174 144 186 Z" fill="#7d8ea0"/>
  </g>
  <path d="M72 160 v12 M120 160 v12" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
  <!-- arms -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 112 L22 100 L24 74" stroke="#2b1d3a" stroke-width="14"/>
    <path d="M40 112 L22 100 L24 74" stroke="#b8c4d0" stroke-width="6"/>
    <path d="M160 116 L178 128 L176 146" stroke="#2b1d3a" stroke-width="14"/>
    <path d="M160 116 L178 128 L176 146" stroke="#b8c4d0" stroke-width="6"/>
  </g>
  <g fill="#7d8ea0" stroke="#2b1d3a" stroke-width="3"><circle cx="22" cy="100" r="6"/><circle cx="178" cy="128" r="6"/></g>
  <!-- spatula hand -->
  <path d="M24 76 V62" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <path d="M10 30 H38 Q40 30 40 34 L36 62 H12 L8 34 Q8 30 10 30 Z" fill="#dfe8ef" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M17 38 V54 M24 38 V54 M31 38 V54" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/>
  <!-- claw hand -->
  <path d="M170 148 Q168 160 176 162 M182 148 Q186 160 178 164" fill="none" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <!-- bottom pancake -->
  <rect x="32" y="126" width="136" height="32" rx="16" fill="#f3b45a" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M36 146 Q100 160 164 146 Q162 156 150 156 H50 Q38 156 36 146 Z" fill="#d48a32"/>
  <!-- grille mouth -->
  <rect x="74" y="132" width="52" height="18" rx="6" fill="#2b1d3a"/>
  <path d="M78 135 H122 L120 140 H80 Z" fill="#fff"/>
  <path d="M86 135 v5 M94 135 v5 M102 135 v5 M110 135 v5 M118 135 v5" stroke="#2b1d3a" stroke-width="2"/>
  <path d="M84 150 L87 144 L90 150 Z M110 150 L113 144 L116 150 Z" fill="#fff"/>
  <!-- middle pancake (face) -->
  <rect x="34" y="90" width="132" height="40" rx="18" fill="#f6bf68" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M38 116 Q100 132 162 116 Q160 126 146 126 H54 Q40 126 38 116 Z" fill="#d48a32"/>
  <g fill="#7d8ea0" stroke="#2b1d3a" stroke-width="2.5"><circle cx="46" cy="106" r="4"/><circle cx="154" cy="106" r="4"/></g>
  <!-- top pancake -->
  <rect x="36" y="60" width="128" height="32" rx="16" fill="#f3b45a" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M60 70 Q80 66 100 66" fill="none" stroke="#ffe0a8" stroke-width="5" stroke-linecap="round"/>
  <!-- syrup over the top -->
  <path d="M44 68 Q100 56 156 68 Q160 74 156 78 Q154 92 148 92 Q142 92 144 80 Q126 80 120 80 Q120 90 114 90 Q108 90 108 82 Q92 82 82 82 Q82 98 74 98 Q66 98 68 82 Q56 82 50 80 Q48 88 44 86 Q40 76 44 68 Z" fill="#d9781e" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M70 68 Q90 62 110 62" fill="none" stroke="#f5a85a" stroke-width="4" stroke-linecap="round"/>
  <!-- eyes -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="80" cy="108" r="13" fill="#fff"/><circle cx="120" cy="108" r="13" fill="#fff"/></g>
  <circle cx="83" cy="110" r="7" fill="#2b1d3a"/><circle cx="117" cy="110" r="7" fill="#2b1d3a"/>
  <circle cx="85" cy="106" r="2.5" fill="#ff4d3a"/><circle cx="119" cy="106" r="2.5" fill="#ff4d3a"/>
  <circle cx="81" cy="112" r="1.6" fill="#fff"/><circle cx="115" cy="112" r="1.6" fill="#fff"/>
  <!-- butter-pat warning light -->
  <path d="M100 58 V46" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <g fill="none" stroke="#ffc93c" stroke-width="4" stroke-linecap="round">
    <path d="M72 22 L80 28 M128 22 L120 28 M100 6 V12 M64 40 H72 M136 40 H128"/>
  </g>
  <path d="M84 24 L116 22 L120 46 L86 48 Z" fill="#ffe066" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M86 42 L118 40 L120 46 L86 48 Z" fill="#f2c230"/>
  <path d="M90 30 L104 29" stroke="#fffbe0" stroke-width="4" stroke-linecap="round"/>
</svg>
