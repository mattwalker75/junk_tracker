  <path d="M84 144 Q100 150 116 144" fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M88 145 L90 151 L93 146 Z M107 146 L110 151 L112 145 Z" fill="#fff" stroke="#2b1d3a" stroke-width="1.5" stroke-linejoin="round"/>
