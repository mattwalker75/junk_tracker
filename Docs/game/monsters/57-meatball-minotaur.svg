  <path d="M92 138 Q92 158 100 158 Q108 158 108 138" fill="none" stroke="#2b1d3a" stroke-width="8" stroke-linecap="round"/>
  <path d="M92 138 Q92 158 100 158 Q108 158 108 138" fill="none" stroke="#ffd66b" stroke-width="3.5" stroke-linecap="round"/>
