  <g fill="#9a5532" stroke="#2b1d3a" stroke-width="4"><circle cx="20" cy="156" r="12"/><circle cx="180" cy="156" r="12"/></g>
  <path d="M14 150 q4 -4 8 0 M22 150 q4 -4 8 0 M170 150 q4 -4 8 0 M178 150 q4 -4 8 0" fill="none" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
