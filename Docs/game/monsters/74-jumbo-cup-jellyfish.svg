<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Jumbo Cup Jellyfish, a jellyfish whose bell is a giant striped soda cup lid with a straw, trailing striped-straw tentacles and fizz bubbles">
