<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Licorice Wrangler, a red licorice-twist cowboy in a brown hat and yellow bandana, twirling a licorice-rope lasso">
  <defs>
    <clipPath id="licorice-wrangler-body"><rect x="72" y="62" width="56" height="102" rx="22"/></clipPath>
  </defs>
  <ellipse cx="100" cy="190" rx="60" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <!-- the lasso loop -->
  <ellipse cx="150" cy="30" rx="40" ry="14" fill="none" stroke="#2b1d3a" stroke-width="10"/>
  <ellipse cx="150" cy="30" rx="40" ry="14" fill="none" stroke="#e2384d" stroke-width="5"/>
  <!-- legs and boots -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <rect x="78" y="150" width="16" height="28" rx="6" fill="#e2384d"/><rect x="106" y="150" width="16" height="28" rx="6" fill="#e2384d"/>
    <path d="M70 186 Q70 174 86 174 L96 174 L96 188 L70 188 Z" fill="#6b3f26"/>
    <path d="M130 186 Q130 174 114 174 L104 174 L104 188 L130 188 Z" fill="#6b3f26"/>
  </g>
  <!-- arms: one down, one up twirling -->
  <g fill="none" stroke-linecap="round">
    <path d="M76 100 Q48 112 48 144" stroke="#2b1d3a" stroke-width="15"/>
    <path d="M124 92 Q150 82 150 44" stroke="#2b1d3a" stroke-width="15"/>
    <path d="M76 100 Q48 112 48 144" stroke="#e2384d" stroke-width="8"/>
    <path d="M124 92 Q150 82 150 44" stroke="#e2384d" stroke-width="8"/>
  </g>
  <!-- the twisted licorice body -->
  <rect x="72" y="62" width="56" height="102" rx="22" fill="#e2384d" stroke="#2b1d3a" stroke-width="4"/>
  <g clip-path="url(#licorice-wrangler-body)" fill="none" stroke="#a81c33" stroke-width="5">
    <path d="M60 70 L140 92 M60 92 L140 114 M60 114 L140 136 M60 136 L140 158 M60 158 L140 180"/>
  </g>
  <g clip-path="url(#licorice-wrangler-body)"><rect x="112" y="60" width="18" height="110" fill="#2b1d3a" opacity="0.15"/></g>
  <rect x="72" y="62" width="56" height="102" rx="22" fill="none" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M80 80 Q82 70 90 66" fill="none" stroke="#ff8fa0" stroke-width="4" stroke-linecap="round"/>
  <!-- bandana -->
  <path d="M70 112 Q100 124 130 112 L124 124 L100 146 L76 124 Z" fill="#ffc93c" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#ffffff"><circle cx="92" cy="124" r="2"/><circle cx="106" cy="126" r="2"/><circle cx="100" cy="136" r="2"/></g>
  <!-- hat -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M36 66 Q100 84 164 66 Q160 78 100 82 Q40 78 36 66 Z" fill="#8a5a36"/>
    <path d="M68 66 Q66 28 84 30 Q100 40 116 30 Q134 28 132 66 Q100 74 68 66 Z" fill="#a8704a"/>
  </g>
  <path d="M68 60 Q100 68 132 60" fill="none" stroke="#2b1d3a" stroke-width="7"/>
  <path d="M68 60 Q100 68 132 60" fill="none" stroke="#ffc93c" stroke-width="3"/>
  <!-- face -->
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="88" cy="90" r="9" fill="#ffffff"/><circle cx="112" cy="90" r="9" fill="#ffffff"/></g>
  <circle cx="90" cy="92" r="5" fill="#2b1d3a"/><circle cx="110" cy="92" r="5" fill="#2b1d3a"/>
  <circle cx="91.5" cy="89.5" r="1.8" fill="#ffffff"/><circle cx="111.5" cy="89.5" r="1.8" fill="#ffffff"/>
  <path d="M78 80 L96 84 M122 80 L104 84" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M90 104 Q102 110 112 102" fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- the rope from hand to loop -->
  <path d="M150 44 Q146 36 136 40" fill="none" stroke="#2b1d3a" stroke-width="9" stroke-linecap="round"/>
  <path d="M150 44 Q146 36 136 40" fill="none" stroke="#e2384d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="46" r="7" fill="#e2384d" stroke="#2b1d3a" stroke-width="3.5"/>
  <circle cx="48" cy="148" r="7" fill="#e2384d" stroke="#2b1d3a" stroke-width="3.5"/>
  <g fill="#ffc93c" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M26 30 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
  </g>
</svg>
