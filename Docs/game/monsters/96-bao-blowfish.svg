  <path d="M58 150 L52 156 M134 150 L140 156" stroke="#f0a868" stroke-width="2" stroke-linecap="round"/>
  <g fill="#ffc93c" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M28 28 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path d="M168 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M178 160 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
