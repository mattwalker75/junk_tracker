<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bao Blowfish, a puffed-up round white steamed bao bun pufferfish with soft spikes, a pleated top with a red dot, little fins, a tail and puffed cheeks">
  <defs>
    <clipPath id="bao-blowfish-body"><circle cx="96" cy="106" r="60"/></clipPath>
  </defs>
  <ellipse cx="98" cy="190" rx="66" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <!-- tail -->
  <path d="M150 100 L186 76 Q194 106 186 136 L150 114 Z" fill="#ffd6a8" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M164 98 L182 88 M166 107 L186 107 M164 116 L182 126" stroke="#f0a868" stroke-width="2.5" stroke-linecap="round"/>
  <!-- soft spikes -->
