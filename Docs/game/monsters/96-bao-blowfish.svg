  <g clip-path="url(#bao-blowfish-body)"><path d="M136 56 Q172 108 124 166 L170 170 L170 40 Z" fill="#ece2d4"/></g>
  <circle cx="96" cy="106" r="60" fill="none" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M46 92 Q50 70 68 60" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- pleated top with a red dot -->
  <g fill="none" stroke="#d9cbb8" stroke-width="3" stroke-linecap="round">
    <path d="M96 52 Q78 54 66 66"/><path d="M96 52 Q86 60 82 72"/><path d="M96 52 Q106 60 110 72"/><path d="M96 52 Q114 54 126 66"/>
  </g>
  <path d="M82 56 Q86 38 96 38 Q106 38 110 56 Q96 50 82 56 Z" fill="#fbf6ee" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M90 52 Q94 44 96 40 M102 52 Q98 44 96 40" fill="none" stroke="#d9cbb8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="96" cy="36" r="5.5" fill="#e2384d" stroke="#2b1d3a" stroke-width="2.5"/>
  <!-- puffed cheeks -->
  <g fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round"><path d="M50 116 Q46 132 60 138"/><path d="M142 116 Q146 132 132 138"/></g>
  <ellipse cx="60" cy="124" rx="9" ry="6" fill="#ff9db8"/><ellipse cx="132" cy="124" rx="9" ry="6" fill="#ff9db8"/>
