  <g stroke="#2b1d3a" stroke-width="4"><circle cx="76" cy="98" r="14" fill="#ffffff"/><circle cx="116" cy="98" r="14" fill="#ffffff"/></g>
  <circle cx="79" cy="101" r="7.5" fill="#2b1d3a"/><circle cx="113" cy="101" r="7.5" fill="#2b1d3a"/>
  <circle cx="82" cy="97" r="2.8" fill="#ffffff"/><circle cx="116" cy="97" r="2.8" fill="#ffffff"/><circle cx="76" cy="105" r="1.4" fill="#ffffff"/><circle cx="110" cy="105" r="1.4" fill="#ffffff"/>
  <path d="M58 78 L88 88 M134 78 L104 88" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
