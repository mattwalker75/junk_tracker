<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Takeout Dragon, a fierce coiled boss dragon whose body is a chain of white takeout boxes, with noodle whiskers, fortune-cookie horns and a gold mane, holding chopsticks and a red paper lantern">
