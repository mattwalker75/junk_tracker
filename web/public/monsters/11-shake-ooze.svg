<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Shake Ooze, a strawberry milkshake slime oozing out of a striped cup, with whipped-cream hair and a bendy straw">
  <defs>
    <clipPath id="shake-ooze-cup"><path d="M60 112 L140 112 L131 186 L69 186 Z"/></clipPath>
    <clipPath id="shake-ooze-blob"><path d="M52 116 C46 74 64 44 100 44 C136 44 154 74 148 116 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="190" rx="46" ry="6" fill="#2b1d3a" opacity="0.15"/>
  <!-- left slime arm drooping over the side -->
  <path d="M60 92 C36 94 28 110 30 132 C30 140 38 140 38 132 C40 138 46 138 46 130 C50 134 54 130 52 122 C50 110 56 104 64 104 Z" fill="#ff9ecb" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- right slime arm waving -->
  <path d="M142 90 C156 84 164 68 162 52 C160 44 168 40 172 46 C176 40 184 44 180 52 C186 54 186 62 178 62 C176 84 168 100 146 104 Z" fill="#ff9ecb" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- straw (behind the cream) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 60 L132 22 Q136 14 146 14 L166 14" stroke="#2b1d3a" stroke-width="15"/>
    <path d="M118 60 L132 22 Q136 14 146 14 L166 14" stroke="#ffffff" stroke-width="8"/>
    <path d="M118 60 L132 22 Q136 14 146 14 L166 14" stroke="#ff4d6d" stroke-width="8" stroke-dasharray="6 6" stroke-linecap="butt"/>
  </g>
  <g fill="none" stroke="#2b1d3a" stroke-width="2"><path d="M128 26 l8 3 M130 21 l7 4 M133 17 l5 5"/></g>
  <!-- cup -->
  <path d="M60 112 L140 112 L131 186 L69 186 Z" fill="#fff7e6" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#shake-ooze-cup)">
    <g fill="#6ec6ff"><path d="M68 112 h12 l-5 78 h-12z"/><path d="M94 112 h12 v78 h-12z"/><path d="M120 112 h12 l5 78 h-12z"/></g>
    <path d="M118 112 L150 112 L140 190 L112 190 Z" fill="#2b1d3a" opacity="0.14"/>
  </g>
  <path d="M60 112 L140 112 L131 186 L69 186 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- the ooze blob rising out of the cup -->
  <path d="M52 116 C46 74 64 44 100 44 C136 44 154 74 148 116 Z" fill="#ff9ecb" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#shake-ooze-blob)"><path d="M122 50 C152 62 154 96 148 118 L112 118 C134 104 138 74 122 50 Z" fill="#f06aa6"/></g>
  <!-- rim, with drips running down the cup -->
  <rect x="50" y="108" width="100" height="12" rx="6" fill="#ff7aa8" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M64 116 v16 a5 5 0 0 0 10 0 v-12 M92 116 v24 a5.5 5.5 0 0 0 11 0 v-20 M124 116 v12 a5 5 0 0 0 10 0 v-8" fill="#ff9ecb" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <rect x="54" y="110" width="92" height="8" rx="4" fill="#ff9ecb"/>
  <!-- whipped cream hair: outline pass, fill pass -->
  <g fill="#ffffff" stroke="#2b1d3a" stroke-width="8">
    <circle cx="74" cy="50" r="14"/><circle cx="92" cy="40" r="16"/><circle cx="112" cy="40" r="15"/><circle cx="128" cy="50" r="13"/><circle cx="102" cy="26" r="12"/><circle cx="108" cy="13" r="7"/>
  </g>
  <g fill="#ffffff">
    <circle cx="74" cy="50" r="14"/><circle cx="92" cy="40" r="16"/><circle cx="112" cy="40" r="15"/><circle cx="128" cy="50" r="13"/><circle cx="102" cy="26" r="12"/><circle cx="108" cy="13" r="7"/>
  </g>
  <g fill="none" stroke="#e3d6c4" stroke-width="3.5" stroke-linecap="round">
    <path d="M80 56 q10 4 18 -2"/><path d="M106 52 q10 4 18 -2"/><path d="M96 32 q6 2 12 -2"/>
  </g>
  <!-- sprinkles on the cream -->
  <g stroke="#2b1d3a" stroke-width="1.2">
    <rect x="84" y="34" width="8" height="3.5" rx="1.75" fill="#ffc93c" transform="rotate(-30 88 36)"/>
    <rect x="114" y="34" width="8" height="3.5" rx="1.75" fill="#7bd36b" transform="rotate(25 118 36)"/>
    <rect x="70" y="46" width="8" height="3.5" rx="1.75" fill="#6ec6ff" transform="rotate(60 74 48)"/>
  </g>
  <!-- face -->
  <path d="M72 58 L92 64 M128 58 L108 64" stroke="#2b1d3a" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="84" cy="76" rx="12" ry="13" fill="#ffffff" stroke="#2b1d3a" stroke-width="4"/>
  <ellipse cx="116" cy="76" rx="12" ry="13" fill="#ffffff" stroke="#2b1d3a" stroke-width="4"/>
  <circle cx="82" cy="79" r="6.5" fill="#2b1d3a"/><circle cx="118" cy="73" r="6.5" fill="#2b1d3a"/>
  <circle cx="84" cy="76" r="2.4" fill="#ffffff"/><circle cx="120" cy="70" r="2.4" fill="#ffffff"/>
  <ellipse cx="66" cy="90" rx="5" ry="3" fill="#ff5d93"/><ellipse cx="134" cy="90" rx="5" ry="3" fill="#ff5d93"/>
  <path d="M86 92 Q100 104 116 92 Q112 100 100 101 Q90 101 86 92 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M104 98 q4 0 4 4 v6 a4 4 0 0 1 -8 0 v-6 q0 -4 4 -4z" fill="#ff4d6d" stroke="#2b1d3a" stroke-width="3"/>
  <path d="M90 93 l3 5 3 -4z M112 93 l-3 5 -3 -4z" fill="#ffffff"/>
  <ellipse cx="62" cy="84" rx="4" ry="8" fill="#ffd3e6" transform="rotate(15 62 84)"/>
  <!-- loose bubbles -->
  <g fill="#ff9ecb" stroke="#2b1d3a" stroke-width="2.5"><circle cx="30" cy="154" r="5"/><circle cx="22" cy="144" r="3"/></g>
</svg>
