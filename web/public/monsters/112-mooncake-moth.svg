<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mooncake Moth, a moth whose round body is a golden mooncake with an embossed flower border, big dusky-lilac spotted wings and fuzzy antennae">
