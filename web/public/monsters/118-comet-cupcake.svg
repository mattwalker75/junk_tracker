    <path d="M22 -42 Q36 -42 36 -24 Q48 -8 40 6 Q34 13 29 7 Q36 -10 22 -42 Z" fill="#ff8fc8"/>
    <path d="M-36 -10 Q-38 -30 -24 -38" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
