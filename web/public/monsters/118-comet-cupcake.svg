    <path d="M20 6 L30 6 L24 48 L16 48 Z" fill="#4aa6e0"/>
    <path d="M-18 6 L-15 48 M-6 6 L-5 48 M6 6 L5 48" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-24 14 L-21 40" stroke="#c4ecff" stroke-width="3.5" stroke-linecap="round"/>
