    <path d="M0 -76 Q5 -70 0 -66 Q-5 -70 0 -76 Z" fill="#ffd34d" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0 -66 L0 -62" stroke="#2b1d3a" stroke-width="2"/>
    <path d="M0 -62 L3.3 -55 L11.6 -54 L5.3 -48 L7.2 -40 L0 -44 L-7.2 -40 L-5.3 -48 L-11.6 -54 L-3.3 -55 Z" fill="#ffc93c" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
    </g>
