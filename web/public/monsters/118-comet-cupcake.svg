    <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="-14" cy="-19" r="10" fill="#ffffff"/><circle cx="14" cy="-19" r="10" fill="#ffffff"/></g>
    <circle cx="-12" cy="-19" r="6" fill="#2b1d3a"/><circle cx="12" cy="-19" r="6" fill="#2b1d3a"/>
    <circle cx="-10" cy="-22" r="2.2" fill="#ffffff"/><circle cx="14" cy="-22" r="2.2" fill="#ffffff"/>
    <path d="M-14 -5 Q0 9 14 -5 Q0 0 -14 -5 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-9 -3 l3 4 3 -3z M6 -3 l-3 4 -3 -3z" fill="#ffffff"/>
    <ellipse cx="-27" cy="-6" rx="4.5" ry="2.8" fill="#ff6f9f"/><ellipse cx="27" cy="-6" rx="4.5" ry="2.8" fill="#ff6f9f"/>
  </g>
  </g>
  <!-- sparkles -->
  <g stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M26 24 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffc93c"/>
    <path d="M176 146 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#ffffff"/>
    <path d="M118 168 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffc93c"/>
