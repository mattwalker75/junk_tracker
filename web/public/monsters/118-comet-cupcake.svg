  <g class="cc-fig">
  <!-- rainbow frosting tail: outline pass, colour pass -->
  <g class="cc-tail" style="transform-origin:118px 92px">
  <g fill="none" stroke="#2b1d3a" stroke-width="16" stroke-linecap="round">
    <path d="M107.3 80.1 Q68.9 102.5 30.5 144.1"/><path d="M112.6 86.1 Q69.4 111.3 26.2 160.8"/><path d="M118 92 Q70 120 22 178"/><path d="M123.4 97.9 Q80.2 123.1 37 172.6"/><path d="M128.7 103.9 Q90.3 126.3 51.9 167.9"/>
  </g>
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M107.3 80.1 Q68.9 102.5 30.5 144.1" stroke="#ff5d73"/>
    <path d="M112.6 86.1 Q69.4 111.3 26.2 160.8" stroke="#ffa83c"/>
    <path d="M118 92 Q70 120 22 178" stroke="#ffe066"/>
    <path d="M123.4 97.9 Q80.2 123.1 37 172.6" stroke="#7fe07a"/>
    <path d="M128.7 103.9 Q90.3 126.3 51.9 167.9" stroke="#6ec6ff"/>
  </g>
  <g fill="#ffffff" stroke="#2b1d3a" stroke-width="1.5">
