    <rect x="46" y="140" width="8" height="3.5" rx="1.7" transform="rotate(-30 50 142)"/>
    <rect x="84" y="118" width="8" height="3.5" rx="1.7" fill="#ff8fc8" transform="rotate(-50 88 120)"/>
    <rect x="34" y="160" width="8" height="3.5" rx="1.7" fill="#b28dff" transform="rotate(20 38 162)"/>
    <rect x="14" y="132" width="8" height="3.5" rx="1.7" fill="#ffe066" transform="rotate(60 18 134)"/>
    <rect x="64" y="160" width="8" height="3.5" rx="1.7" fill="#ff8fc8" transform="rotate(-20 68 162)"/>
  </g>
  </g>
  <!-- the cupcake, flying up and to the right -->
  <g transform="translate(124 86) rotate(35)">
