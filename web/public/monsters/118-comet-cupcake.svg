<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Comet Cupcake, a frosted cupcake with a star-shaped candle streaking diagonally through space, trailing a long rainbow frosting tail full of sprinkles">
