  </g>
  <!-- face -->
  <g stroke="#2b1d3a" stroke-width="4">
    <circle cx="80" cy="80" r="14" fill="#fff"/><circle cx="120" cy="80" r="14" fill="#fff"/>
  </g>
  <circle cx="83" cy="82" r="7.5" fill="#2b1d3a"/><circle cx="117" cy="82" r="7.5" fill="#2b1d3a"/>
  <circle cx="85" cy="78" r="2.6" fill="#fff"/><circle cx="119" cy="78" r="2.6" fill="#fff"/>
  <path d="M64 62 L92 68 M136 62 L108 68" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
