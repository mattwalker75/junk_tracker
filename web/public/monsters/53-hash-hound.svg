  <!-- snout -->
  <ellipse cx="100" cy="106" rx="24" ry="15" fill="#ffd987" stroke="#2b1d3a" stroke-width="4"/>
  <ellipse cx="100" cy="99" rx="9" ry="6" fill="#2b1d3a"/>
  <ellipse cx="97" cy="97" rx="3" ry="1.6" fill="#fff"/>
  <path d="M100 105 V110 M86 110 Q100 118 114 110" fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M89 112 L92 119 L95 113 Z M105 113 L108 119 L111 112 Z" fill="#fff" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M104 114 Q104 132 112 132 Q120 132 118 114 Z" fill="#ff6f8e" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M111 118 V126" stroke="#d9466a" stroke-width="2.5" stroke-linecap="round"/>
