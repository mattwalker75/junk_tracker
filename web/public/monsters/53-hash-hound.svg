    <path d="M146 140 Q172 136 176 110" stroke="#f2b544" stroke-width="8"/>
  </g>
  <path d="M180 100 q6 -2 8 4 M182 116 q6 2 6 8" fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round"/>
