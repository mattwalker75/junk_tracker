<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Freezer Burn, a faded old ice cream tub crusted with frost, lid crooked like a hat, with frosty brows and an icicle beard, hands on its hips">
  <ellipse cx="100" cy="190" rx="66" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <!-- one arm down, one shaking a fist -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 118 Q30 136 30 160" stroke="#2b1d3a" stroke-width="15"/>
    <path d="M152 112 Q178 104 176 78" stroke="#2b1d3a" stroke-width="15"/>
    <path d="M50 118 Q30 136 30 160" stroke="#a9bccf" stroke-width="8"/>
    <path d="M152 112 Q178 104 176 78" stroke="#a9bccf" stroke-width="8"/>
  </g>
  <g fill="#a9bccf" stroke="#2b1d3a" stroke-width="3.5"><circle cx="30" cy="164" r="10"/><circle cx="176" cy="72" r="11"/></g>
  <path d="M170 68 l8 0 M170 74 l9 0" stroke="#7f97b0" stroke-width="2.5" stroke-linecap="round"/>
  <g stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"><path d="M186 56 l5 -6 M190 66 l7 -2 M176 54 l0 -8"/></g>
  <!-- the tub -->
  <path d="M44 70 L156 70 L148 174 Q100 184 52 174 Z" fill="#b9c7d6" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M136 74 L154 74 L146 172 Q138 175 128 176 Z" fill="#9fb0c3"/>
  <path d="M44 70 L156 70 L148 174 Q100 184 52 174 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- faded, peeling label -->
  <path d="M48 98 Q100 108 152 98 L149 134 Q100 144 51 134 Z" fill="#e8dcc8" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M149 134 Q140 126 150 118 L152 98" fill="#cfc2ad" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 128 Q80 132 92 130" fill="none" stroke="#c9b99f" stroke-width="3" stroke-linecap="round"/>
  <!-- rim, with frost -->
  <ellipse cx="100" cy="70" rx="56" ry="13" fill="#dbe5ef" stroke="#2b1d3a" stroke-width="4"/>
  <!-- the crooked lid -->
  <g transform="rotate(-12 98 46)" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M46 46 L46 54 Q98 70 150 54 L150 46 Z" fill="#7f97b0"/>
    <ellipse cx="98" cy="46" rx="52" ry="12" fill="#93abc4"/>
  </g>
  <g fill="#f2fbff" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M62 34 Q70 24 84 28 Q96 22 106 30 Q116 26 120 34 Q106 40 92 36 Q78 42 62 34 Z"/>
    <path d="M44 78 Q50 86 46 96 Q40 88 44 78 Z"/>
    <path d="M156 78 Q160 90 152 98 Q150 88 156 78 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.9"><circle cx="58" cy="152" r="2.5"/><circle cx="66" cy="160" r="1.8"/><circle cx="140" cy="150" r="2.2"/><circle cx="134" cy="160" r="1.6"/><circle cx="70" cy="82" r="2"/><circle cx="130" cy="84" r="2.4"/></g>
  <!-- grumpy face -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="80" cy="114" r="12" fill="#ffffff"/><circle cx="120" cy="114" r="12" fill="#ffffff"/></g>
  <circle cx="81" cy="118" r="6.5" fill="#2b1d3a"/><circle cx="119" cy="118" r="6.5" fill="#2b1d3a"/>
  <circle cx="83" cy="117" r="2" fill="#ffffff"/><circle cx="121" cy="117" r="2" fill="#ffffff"/>
  <path d="M68 113 A12 12 0 0 1 92 113 Z M108 113 A12 12 0 0 1 132 113 Z" fill="#9fb0c3" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- bushy frost brows -->
  <g fill="#f2fbff" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M64 98 Q70 92 78 96 Q84 92 92 100 Q84 104 76 101 Q70 104 64 98 Z"/>
    <path d="M136 98 Q130 92 122 96 Q116 92 108 100 Q116 104 124 101 Q130 104 136 98 Z"/>
  </g>
  <path d="M86 142 Q100 134 114 142" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linecap="round"/>
  <!-- icicle beard -->
  <path d="M82 146 L86 162 L91 148 L96 170 L101 149 L106 166 L111 148 L115 158 L118 146 Q100 152 82 146 Z" fill="#e6f6ff" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <!-- ice crystals -->
  <g fill="#6ec6ff" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M26 46 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path d="M172 26 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M178 170 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
</svg>
