  <g fill="#fff4dc" stroke="#2b1d3a" stroke-width="3.5"><circle cx="86" cy="104" r="16"/><circle cx="114" cy="104" r="16"/></g>
  <g stroke-width="3" stroke-linecap="round">
    <path d="M78 100 l-6 -3" stroke="#39a0ff"/><path d="M80 108 l-7 1" stroke="#ffc93c"/><path d="M88 112 l-4 5" stroke="#7bd36b"/>
    <path d="M122 100 l6 -3" stroke="#ff4d6d"/><path d="M120 108 l7 1" stroke="#b96ad9"/><path d="M112 112 l4 5" stroke="#39a0ff"/>
  </g>
  <ellipse cx="100" cy="92" rx="9" ry="6" fill="#7a3a4a" stroke="#2b1d3a" stroke-width="3"/>
  <ellipse cx="97" cy="90" rx="3" ry="1.6" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="62" cy="88" rx="6" ry="3.5" fill="#ff7fa2"/><ellipse cx="138" cy="88" rx="6" ry="3.5" fill="#ff7fa2"/>
  <g fill="#6ec6ff" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M28 40 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path d="M168 34 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
</svg>
