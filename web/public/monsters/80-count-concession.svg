<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Count Concession, a vampire boss in a red velvet theater-curtain cape with gold tassels, holding a tray of nachos and a jumbo soda, a ticket-stub bow tie and fangs">
  <ellipse class="cc-shadow" cx="100" cy="192" rx="86" ry="6" fill="#2b1d3a" opacity="0.2"/>
  <g class="cc-fig">
