<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Biscuit Badger, a stout badger shaped like a flaky golden buttermilk biscuit with a white gravy stripe down its head, digging with sausage-patty paws">
  <defs>
    <clipPath id="biscuit-badger-head"><rect x="44" y="30" width="112" height="98" rx="40"/></clipPath>
    <clipPath id="biscuit-badger-body"><rect x="26" y="102" width="148" height="76" rx="32"/></clipPath>
  </defs>
  <ellipse cx="100" cy="190" rx="80" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <!-- flying crumbs from the dig -->
  <g fill="#e0a347" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M14 132 l7 -3 3 6 -6 3z"/><path d="M22 112 l5 -1 1 5 -5 1z"/><path d="M180 128 l7 2 -2 6 -6 -2z"/><path d="M176 108 l5 1 -1 5 -5 -1z"/>
  </g>
  <!-- biscuit body -->
  <rect x="26" y="102" width="148" height="76" rx="32" fill="#f2c777" stroke="#2b1d3a" stroke-width="4"/>
  <g clip-path="url(#biscuit-badger-body)">
    <path d="M150 100 Q182 130 156 182 L180 182 L180 100 Z" fill="#d99a2e"/>
    <path d="M26 132 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 M26 156 q16 6 32 0 t32 0 t32 0 t32 0 t32 0" fill="none" stroke="#c9862a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- ears -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="54" cy="40" r="14" fill="#e0a347"/><circle cx="146" cy="40" r="14" fill="#e0a347"/></g>
  <circle cx="54" cy="40" r="6.5" fill="#ff9db8"/><circle cx="146" cy="40" r="6.5" fill="#ff9db8"/>
  <!-- biscuit head -->
  <rect x="44" y="30" width="112" height="98" rx="40" fill="#f2c777"/>
  <g clip-path="url(#biscuit-badger-head)">
    <ellipse cx="100" cy="30" rx="70" ry="22" fill="#e0a347"/>
    <path d="M134 30 Q168 80 138 130 L160 130 L160 30 Z" fill="#d99a2e"/>
    <path d="M44 106 q14 5 26 0 M130 106 q14 5 26 0" fill="none" stroke="#c9862a" stroke-width="3" stroke-linecap="round"/>
    <!-- gravy stripe -->
    <path d="M86 26 Q100 22 114 26 L111 60 Q114 70 108 74 Q106 88 104 98 L96 98 Q94 88 92 74 Q86 70 89 60 Z" fill="#fffaf0" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#5a4a5a"><circle cx="98" cy="40" r="1.3"/><circle cx="104" cy="50" r="1.3"/><circle cx="96" cy="62" r="1.3"/><circle cx="102" cy="78" r="1.3"/></g>
  </g>
  <rect x="44" y="30" width="112" height="98" rx="40" fill="none" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M58 60 Q62 46 74 40" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- eyes -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="73" cy="80" r="13" fill="#ffffff"/><circle cx="127" cy="80" r="13" fill="#ffffff"/></g>
  <circle cx="76" cy="83" r="7" fill="#2b1d3a"/><circle cx="124" cy="83" r="7" fill="#2b1d3a"/>
  <circle cx="79" cy="79" r="2.7" fill="#ffffff"/><circle cx="127" cy="79" r="2.7" fill="#ffffff"/>
  <path d="M54 62 L84 70 M146 62 L116 70" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="58" cy="100" rx="6" ry="3.5" fill="#ff9db8"/><ellipse cx="142" cy="100" rx="6" ry="3.5" fill="#ff9db8"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="108" rx="23" ry="14" fill="#fbe3b0" stroke="#2b1d3a" stroke-width="3.5"/>
  <ellipse cx="100" cy="100" rx="8" ry="5.5" fill="#2b1d3a"/>
  <path d="M84 108 Q100 126 116 108 Q100 115 84 108 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M89 110 l3 5 3 -4z M111 110 l-3 5 -3 -4z M98 113 l2 4 2 -4z" fill="#ffffff"/>
  <!-- sausage-patty paws digging -->
  <g stroke="#2b1d3a" stroke-width="4"><ellipse cx="58" cy="172" rx="25" ry="13" fill="#9a5530"/><ellipse cx="142" cy="172" rx="25" ry="13" fill="#9a5530"/></g>
  <g fill="#6e3a1e"><circle cx="50" cy="170" r="2"/><circle cx="62" cy="176" r="1.8"/><circle cx="66" cy="166" r="1.6"/><circle cx="134" cy="170" r="2"/><circle cx="148" cy="176" r="1.8"/><circle cx="150" cy="166" r="1.6"/></g>
  <path d="M42 166 Q50 162 58 162 M126 166 Q134 162 142 162" fill="none" stroke="#c47a48" stroke-width="3" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#2b1d3a" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40 180 l-6 8 9 -3z M50 183 l-3 8 7 -5z M61 184 l0 8 5 -7z"/>
    <path d="M160 180 l6 8 -9 -3z M150 183 l3 8 -7 -5z M139 184 l0 8 -5 -7z"/>
