  <path d="M110 64 Q150 62 186 80 Q150 74 110 72 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M116 66 l3 5 3 -5z M130 66 l3 5 3 -5z M144 67 l3 5 3 -5z M158 70 l3 5 3 -4z" fill="#ffffff"/>
  <!-- berries on its head -->
  <g class="cc-hat" style="transform-origin:70px 32px">
  <g stroke="#2b1d3a" stroke-width="3"><circle cx="56" cy="26" r="7" fill="#4a5bd4"/><circle cx="70" cy="18" r="7" fill="#4a5bd4"/><circle cx="86" cy="24" r="8" fill="#e2384d"/></g>
  <g fill="#ffffff"><circle cx="54" cy="24" r="1.8"/><circle cx="68" cy="16" r="1.8"/></g>
  <g fill="#ff8a9e"><circle cx="83" cy="21" r="1.5"/><circle cx="89" cy="24" r="1.5"/><circle cx="85" cy="28" r="1.5"/></g>
  </g>
  <!-- eyes -->
  <g stroke="#2b1d3a" stroke-width="4"><circle cx="58" cy="64" r="12" fill="#ffffff"/><circle cx="90" cy="64" r="12" fill="#ffffff"/></g>
  <circle cx="61" cy="67" r="6.5" fill="#2b1d3a"/><circle cx="91" cy="67" r="6.5" fill="#2b1d3a"/>
  <circle cx="63" cy="63" r="2.5" fill="#ffffff"/><circle cx="93" cy="63" r="2.5" fill="#ffffff"/>
  <path d="M42 46 L68 54 M106 46 L80 54" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="50" cy="83" rx="6" ry="3.5" fill="#ff9db8"/><ellipse cx="98" cy="83" rx="6" ry="3.5" fill="#ff9db8"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffc93c" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M16 60 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M168 18 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M168 138 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
  </g>
</svg>
