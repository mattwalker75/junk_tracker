  <g clip-path="url(#french-toast-toucan-beak)">
    <rect x="100" y="20" width="42" height="80" fill="#ffe066"/>
    <rect x="142" y="20" width="9" height="80" fill="#fff6d6"/>
    <rect x="151" y="20" width="50" height="80" fill="#e2384d"/>
    <path d="M151 20 L201 20 L201 100 L172 100 Q190 70 151 50 Z" fill="#c42a3e"/>
    <g fill="#fff3b0" stroke="#d9b23a" stroke-width="1.5"><circle cx="122" cy="52" r="5"/><circle cx="134" cy="80" r="4.5"/></g>
    <g fill="#8a6a2a"><circle cx="122" cy="52" r="1.2"/><circle cx="134" cy="80" r="1.1"/></g>
    <g fill="#ffe066"><ellipse cx="160" cy="50" rx="1.2" ry="2"/><ellipse cx="170" cy="58" rx="1.2" ry="2"/><ellipse cx="160" cy="84" rx="1.2" ry="2"/><ellipse cx="174" cy="82" rx="1.2" ry="2"/><ellipse cx="178" cy="68" rx="1.2" ry="2"/></g>
  </g>
  <path d="M108 44 Q154 32 186 66 Q192 84 182 92 Q148 90 110 88 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M120 44 Q140 40 156 46" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
