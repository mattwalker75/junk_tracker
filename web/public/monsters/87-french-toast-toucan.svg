<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="French Toast Toucan, a toucan made of stacked golden French-toast slices dusted with powdered sugar, with a huge banana-and-strawberry striped beak and berries on its head">
  <defs>
    <clipPath id="french-toast-toucan-beak"><path d="M108 44 Q154 32 186 66 Q192 84 182 92 Q148 90 110 88 Z"/></clipPath>
  </defs>
  <ellipse class="cc-shadow" cx="96" cy="190" rx="74" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <g class="cc-fig">
  <!-- toast tail -->
  <g class="cc-tail" style="transform-origin:50px 158px">
  <path d="M44 150 L14 172 Q14 182 26 182 L56 166 Z" fill="#b8692e" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M42 156 L22 172 L28 176 L50 164 Z" fill="#f0b354"/>
  </g>
  <!-- feet -->
  <g class="cc-leg-l" style="transform-origin:64px 177px" fill="#ff9d3c" stroke="#2b1d3a" stroke-width="3.5"><ellipse cx="64" cy="182" rx="13" ry="6"/></g>
  <g class="cc-leg-r" style="transform-origin:100px 177px" fill="#ff9d3c" stroke="#2b1d3a" stroke-width="3.5"><ellipse cx="100" cy="182" rx="13" ry="6"/></g>
  <!-- stacked French-toast body, bottom first -->
  <g stroke="#2b1d3a" stroke-width="4"><rect x="32" y="146" width="96" height="31" rx="11" fill="#b8692e"/></g>
  <rect x="37" y="150" width="86" height="21" rx="8" fill="#f0b354"/><rect x="108" y="150" width="15" height="21" rx="6" fill="#dd963a"/>
  <g stroke="#2b1d3a" stroke-width="4"><rect x="40" y="120" width="98" height="31" rx="11" fill="#b8692e"/></g>
  <rect x="45" y="124" width="88" height="21" rx="8" fill="#f0b354"/><rect x="118" y="124" width="15" height="21" rx="6" fill="#dd963a"/>
  <g stroke="#2b1d3a" stroke-width="4"><rect x="30" y="94" width="98" height="31" rx="11" fill="#b8692e"/></g>
  <rect x="35" y="98" width="88" height="21" rx="8" fill="#f0b354"/><rect x="108" y="98" width="15" height="21" rx="6" fill="#dd963a"/>
  <!-- powdered sugar -->
  <g fill="#ffffff">
    <path d="M42 152 q10 -3 20 0 q8 3 16 0 q2 4 -8 5 q-14 1 -28 -1z"/><path d="M52 126 q10 -3 20 0 q8 3 16 0 q2 4 -8 5 q-14 1 -28 -1z"/><path d="M44 100 q10 -3 20 0 q8 3 16 0 q2 4 -8 5 q-14 1 -28 -1z"/>
    <circle cx="98" cy="160" r="1.8"/><circle cx="110" cy="136" r="1.8"/><circle cx="64" cy="112" r="1.6"/><circle cx="96" cy="108" r="1.8"/><circle cx="50" cy="164" r="1.6"/>
  </g>
  <g class="cc-head" style="transform-origin:76px 96px">
  <!-- toast-slice head -->
  <path d="M34 98 L34 56 Q26 30 50 30 Q76 14 102 30 Q126 30 118 56 L118 98 Z" fill="#b8692e" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M40 92 L40 56 Q34 37 52 36 Q76 22 100 36 Q118 37 112 56 L112 92 Z" fill="#f0b354"/>
  <path d="M100 40 Q112 46 108 60 L108 92 L100 92 Z" fill="#dd963a"/>
