  <path d="M46 108 l0 6 M52 109 l0 7 M58 108 l0 6 M142 108 l0 6 M148 109 l0 7 M154 108 l0 6" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
