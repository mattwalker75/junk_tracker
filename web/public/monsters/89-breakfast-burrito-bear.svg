  <circle cx="70" cy="30" r="6" fill="#e8b08a"/><circle cx="130" cy="30" r="6" fill="#e8b08a"/>
  <circle cx="100" cy="62" r="38" fill="#a8683a" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M120 32 Q148 58 128 96 Q136 62 120 32 Z" fill="#8a5230"/>
  <path d="M72 44 Q78 32 90 28" fill="none" stroke="#d29a6c" stroke-width="5" stroke-linecap="round"/>
