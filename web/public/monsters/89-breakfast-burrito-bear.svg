  <g fill="#4caf50"><circle cx="164" cy="159" r="1.6"/><circle cx="176" cy="161" r="1.6"/></g><circle cx="170" cy="158" r="1.5" fill="#ffffff"/>
  <path d="M158 168 L160 180" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
