  <circle cx="86" cy="62" r="6.5" fill="#2b1d3a"/><circle cx="114" cy="62" r="6.5" fill="#2b1d3a"/>
  <circle cx="88" cy="62" r="2" fill="#ffffff"/><circle cx="116" cy="62" r="2" fill="#ffffff"/>
  <path d="M72 58 A12 12 0 0 1 96 58 Z M104 58 A12 12 0 0 1 128 58 Z" fill="#8a5230" stroke="#2b1d3a" stroke-width="3"/>
  <path d="M70 42 L94 49 M130 42 L106 49" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
