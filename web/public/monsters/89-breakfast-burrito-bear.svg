  <ellipse cx="100" cy="75" rx="7" ry="4.5" fill="#2b1d3a"/>
  <path d="M88 82 Q100 94 112 82 Q100 87 88 82 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
