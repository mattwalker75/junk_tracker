<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Breakfast Burrito Bear, a sleepy, grumpy brown bear wrapped in a big tortilla like a blanket, with scrambled egg, bacon and cheese peeking out around its head and a little salsa cup">
