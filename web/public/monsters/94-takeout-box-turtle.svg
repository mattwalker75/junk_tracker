    <path d="M110 76 Q108 54 120 52 Q130 52 126 64 M128 74 Q130 48 142 54 Q150 60 140 66 M118 76 Q116 60 106 62" stroke="#2b1d3a" stroke-width="9"/>
    <path d="M110 76 Q108 54 120 52 Q130 52 126 64 M128 74 Q130 48 142 54 Q150 60 140 66 M118 76 Q116 60 106 62" stroke="#ffd36b" stroke-width="4.5"/>
  </g>
  <!-- the takeout box shell -->
  <path d="M64 88 L188 88 L174 164 L78 164 Z" fill="#ffffff" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#takeout-box-turtle-box)">
    <path d="M160 86 L192 86 L178 168 L150 168 Z" fill="#e6e2ee"/>
  </g>
  <path d="M70 100 L182 100 M72 108 L180 108 M77 152 L175 152" stroke="#e2384d" stroke-width="3"/>
  <!-- a little red paper lantern printed on the box -->
  <path d="M126 112 L126 116 M126 144 L126 150" stroke="#e2384d" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="126" cy="130" rx="13" ry="13" fill="#e2384d"/>
  <path d="M126 118 Q118 130 126 142 M126 118 Q134 130 126 142" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <rect x="119" y="115" width="14" height="4" rx="1.5" fill="#ffc93c"/><rect x="119" y="141" width="14" height="4" rx="1.5" fill="#ffc93c"/>
  <!-- folded top flaps -->
  <g fill="#ffffff" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M60 90 L82 64 L116 78 L104 90 Z"/>
    <path d="M192 90 L170 64 L136 78 L148 90 Z"/>
  </g>
  <path d="M170 66 L186 88 L148 88 L138 78 Z" fill="#e6e2ee"/>
  <path d="M192 90 L170 64 L136 78 L148 90 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M74 84 L84 72" stroke="#f0f0f8" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 116 L74 140" stroke="#f4f1f8" stroke-width="4" stroke-linecap="round"/>
  <!-- near legs -->
