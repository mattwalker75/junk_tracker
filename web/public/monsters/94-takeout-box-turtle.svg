<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Takeout Box Turtle, a grumpy green turtle whose shell is a white folded takeout box with red lines and a wire handle, noodles peeking out of the top">
  <defs>
    <clipPath id="takeout-box-turtle-box"><path d="M64 88 L188 88 L174 164 L78 164 Z"/></clipPath>
  </defs>
  <ellipse class="cc-shadow" cx="114" cy="190" rx="78" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <g class="cc-fig">
  <!-- far legs and tail -->
  <g fill="#4f9a3c" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <rect x="106" y="150" width="22" height="30" rx="10"/>
  </g>
  <g class="cc-tail" style="transform-origin:174px 148px" fill="#4f9a3c" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <path d="M176 140 L192 152 L174 156 Z"/>
  </g>
  <!-- wire handle -->
  <path d="M78 84 Q78 22 126 22 Q174 22 174 84" fill="none" stroke="#2b1d3a" stroke-width="7" stroke-linecap="round"/>
  <path d="M78 84 Q78 22 126 22 Q174 22 174 84" fill="none" stroke="#c6ccd8" stroke-width="3" stroke-linecap="round"/>
  <!-- noodles peeking out -->
