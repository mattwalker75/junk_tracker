    <path d="M86 180 l0 -5 M93 181 l0 -5" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="cc-leg-r" style="transform-origin:159px 158px">
    <rect x="146" y="154" width="26" height="30" rx="11" fill="#5fb84a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M152 180 l0 -5 M159 181 l0 -5" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="cc-head" style="transform-origin:80px 130px">
  <!-- neck and head -->
  <path d="M78 130 Q62 130 56 120" fill="none" stroke="#2b1d3a" stroke-width="26" stroke-linecap="round"/>
  <path d="M78 130 Q62 130 56 120" fill="none" stroke="#5fb84a" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="42" cy="110" rx="34" ry="30" fill="#5fb84a" stroke="#2b1d3a" stroke-width="4"/>
  <path d="M64 92 Q80 116 60 136 Q72 112 64 92 Z" fill="#4f9a3c"/>
  <path d="M18 98 Q22 88 34 84" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <g fill="#4f9a3c"><circle cx="30" cy="132" r="2.5"/><circle cx="54" cy="134" r="2"/></g>
  <!-- grumpy face -->
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="30" cy="106" r="11" fill="#ffffff"/><circle cx="56" cy="106" r="11" fill="#ffffff"/></g>
  <circle cx="33" cy="108" r="6" fill="#2b1d3a"/><circle cx="53" cy="108" r="6" fill="#2b1d3a"/>
  <circle cx="35" cy="105" r="2.2" fill="#ffffff"/><circle cx="55" cy="105" r="2.2" fill="#ffffff"/>
  <path d="M16 88 L39 97 M70 88 L47 97" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <rect x="28" y="122" width="30" height="10" rx="4" fill="#ffffff" stroke="#2b1d3a" stroke-width="3"/>
  <path d="M35.5 122 l0 10 M43 122 l0 10 M50.5 122 l0 10 M28 127 l30 0" stroke="#2b1d3a" stroke-width="2"/>
  <ellipse cx="17" cy="122" rx="5" ry="3" fill="#ff9db8"/><ellipse cx="68" cy="120" rx="4" ry="3" fill="#ff9db8"/>
  </g>
  <g fill="#ffc93c" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M30 30 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path d="M182 26 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
  </g>
</svg>
