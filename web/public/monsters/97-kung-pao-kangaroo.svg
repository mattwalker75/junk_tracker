  <g fill="#ff9db8"><ellipse cx="75" cy="33" rx="4.5" ry="14" transform="rotate(-18 75 33)"/><ellipse cx="125" cy="33" rx="4.5" ry="14" transform="rotate(18 125 33)"/></g>
  <!-- head -->
