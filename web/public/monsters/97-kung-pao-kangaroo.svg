    <ellipse cx="112" cy="132" rx="8" ry="5" transform="rotate(25 112 132)"/>
  </g>
  <path d="M84 131 l0 6 M112 129 l-1 6" stroke="#c48e4e" stroke-width="2" stroke-linecap="round"/>
  <use href="#kung-pao-kangaroo-chilli" transform="translate(98 128) rotate(-60)"/>
  <use href="#kung-pao-kangaroo-chilli" transform="translate(124 136) rotate(-110) scale(0.8)"/>
  <path d="M72 136 Q100 144 128 136 Q130 172 100 174 Q70 172 72 136 Z" fill="#c95a34" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M78 144 Q100 150 122 144" fill="none" stroke="#e8946a" stroke-width="3" stroke-linecap="round"/>
  <!-- ears -->
  <g stroke="#2b1d3a" stroke-width="4" fill="#b8452a">
