<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Kung Pao Kangaroo, a glossy red-brown sauce-coloured kangaroo with its fists up, a pouch full of peanuts and little red chilli peppers, and chilli-pepper sparks flying">
  <defs>
    <clipPath id="kung-pao-kangaroo-body"><path d="M100 80 Q140 82 144 130 Q148 176 100 178 Q52 176 56 130 Q60 82 100 80 Z"/></clipPath>
    <g id="kung-pao-kangaroo-chilli">
      <path d="M-9 -3 Q4 -7 10 4 Q11 10 7 11 Q4 2 -9 2 Z" fill="#e2384d" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-9 -1 L-14 -4" stroke="#4caf50" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>
  <ellipse class="cc-shadow" cx="104" cy="190" rx="80" ry="7" fill="#2b1d3a" opacity="0.18"/>
  <g class="cc-fig">
  <!-- tail -->
  <g class="cc-tail" style="transform-origin:126px 156px">
  <path d="M128 148 Q172 156 190 184 Q156 186 122 174 Z" fill="#b8452a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M150 166 Q170 172 182 182" fill="none" stroke="#8f3220" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- big feet and haunches -->
  <g class="cc-leg-l" style="transform-origin:68px 142px" fill="#b8452a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"><ellipse cx="66" cy="181" rx="26" ry="8"/><ellipse cx="68" cy="158" rx="20" ry="22"/></g>
  <g class="cc-leg-r" style="transform-origin:132px 142px" fill="#b8452a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"><ellipse cx="132" cy="181" rx="26" ry="8"/><ellipse cx="132" cy="158" rx="20" ry="22"/></g>
  <!-- body -->
  <path d="M100 80 Q140 82 144 130 Q148 176 100 178 Q52 176 56 130 Q60 82 100 80 Z" fill="#b8452a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#kung-pao-kangaroo-body)">
    <path d="M126 82 Q156 130 128 180 L150 180 L150 80 Z" fill="#8f3220"/>
    <ellipse cx="98" cy="140" rx="30" ry="36" fill="#e07a4a"/>
  </g>
  <path d="M100 80 Q140 82 144 130 Q148 176 100 178 Q52 176 56 130 Q60 82 100 80 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M64 120 Q66 102 78 94" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- pouch: peanuts and chillies peeking out -->
  <g fill="#e6b878" stroke="#2b1d3a" stroke-width="2.5">
