  <path d="M74 48 Q78 38 90 34" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="100" cy="76" rx="18" ry="11" fill="#e07a4a" stroke="#2b1d3a" stroke-width="3"/>
  <ellipse cx="100" cy="68" rx="6" ry="3.8" fill="#2b1d3a"/>
  <path d="M88 76 Q100 88 112 76 Q100 80 88 76 Z" fill="#2b1d3a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M92 77 l2.5 5 2.5 -4z M108 77 l-2.5 5 -2.5 -4z" fill="#ffffff"/>
  <g stroke="#2b1d3a" stroke-width="3.5"><circle cx="84" cy="54" r="10.5" fill="#ffffff"/><circle cx="116" cy="54" r="10.5" fill="#ffffff"/></g>
  <circle cx="87" cy="56" r="6" fill="#2b1d3a"/><circle cx="113" cy="56" r="6" fill="#2b1d3a"/>
  <circle cx="89" cy="53" r="2.2" fill="#ffffff"/><circle cx="115" cy="53" r="2.2" fill="#ffffff"/>
  <path d="M70 39 L93 46 M130 39 L107 46" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="72" cy="72" rx="5" ry="3" fill="#ff9db8"/><ellipse cx="128" cy="72" rx="5" ry="3" fill="#ff9db8"/>
  <!-- boxing-ready fists -->
  <g class="cc-arm-l" style="transform-origin:76px 104px">
    <path d="M74 104 Q60 108 50 96" fill="none" stroke="#2b1d3a" stroke-width="18" stroke-linecap="round"/>
    <path d="M74 104 Q60 108 50 96" fill="none" stroke="#b8452a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="44" cy="90" r="15" fill="#c95a34" stroke="#2b1d3a" stroke-width="4"/>
    <path d="M36 84 Q40 78 48 78" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 98 l6 -6 M40 97 l8 -8" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="cc-arm-r" style="transform-origin:124px 104px">
    <path d="M126 104 Q140 108 150 96" fill="none" stroke="#2b1d3a" stroke-width="18" stroke-linecap="round"/>
    <path d="M126 104 Q140 108 150 96" fill="none" stroke="#b8452a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="156" cy="90" r="15" fill="#c95a34" stroke="#2b1d3a" stroke-width="4"/>
    <path d="M148 80 Q156 76 162 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M154 98 l-6 -6 M160 97 l-8 -8" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  </g>
  <!-- chilli-pepper sparks -->
  <path d="M22 68 L14 62 M26 60 L22 50 M178 68 L186 62 M174 60 L178 50" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round"/>
  <use href="#kung-pao-kangaroo-chilli" transform="translate(28 38) rotate(30)"/>
  <use href="#kung-pao-kangaroo-chilli" transform="translate(172 36) rotate(150)"/>
  <use href="#kung-pao-kangaroo-chilli" transform="translate(22 124) rotate(-20) scale(0.9)"/>
  <g fill="#ffc93c" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round">
    <path d="M150 12 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path d="M40 10 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M178 122 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
</svg>
